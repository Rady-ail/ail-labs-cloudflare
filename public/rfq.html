<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Quotation — AIL LABS</title><style>body{font-family:system-ui;margin:auto;max-width:760px;padding:24px;background:#f7fbfb;color:#082f32}form{display:grid;gap:12px;background:white;padding:20px;border-radius:16px}input,textarea,button{padding:12px;border:1px solid #dce9e7;border-radius:10px}button{background:#082f32;color:white;font-weight:800}</style></head><body><h1>Request Quotation</h1><p>Harga tidak ditampilkan publik. Kirim kebutuhan B2B untuk diproses admin.</p><form id="f"><input name="company" placeholder="Perusahaan" required><input name="name" placeholder="Nama" required><input name="whatsapp" placeholder="WhatsApp +62..." required><input name="email" type="email" placeholder="Email" required><input name="product_interest" placeholder="Produk diminati"><textarea name="notes" placeholder="Kebutuhan dan qty"></textarea><label><input name="consent" type="checkbox" required> Saya menyetujui pemrosesan data untuk inquiry/quotation.</label><label><input name="verified" type="checkbox" required> Saya menyelesaikan verifikasi manusia/OTP sesuai instruksi.</label><button>Kirim RFQ</button><p id="m"></p></form><script>const f=document.querySelector('#f'),m=document.querySelector('#m');f.addEventListener('submit',async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(f));x.consent=true;x.verified=true;x.items=[];m.textContent='Validasi RFQ memerlukan product_id dan qty dari katalog.'});</script></body></html>
