<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Quotation — AIL LABS</title><style>body{font-family:system-ui;margin:auto;max-width:760px;padding:24px;background:#f7fbfb;color:#082f32}form{display:grid;gap:12px;background:white;padding:20px;border-radius:16px}input,textarea,button{padding:12px;border:1px solid #dce9e7;border-radius:10px}button{background:#082f32;color:white;font-weight:800}</style></head><body><h1>Request Quotation</h1><p>Harga tidak ditampilkan publik. Kirim kebutuhan B2B untuk diproses admin.</p><form id="f"><input name="company" placeholder="Perusahaan" required><input name="name" placeholder="Nama" required><input name="whatsapp" placeholder="WhatsApp +62..." required><input name="email" type="email" placeholder="Email" required><select id="p" required><option value="">Pilih produk</option></select><input id="q" type="number" min="1" value="1" placeholder="Qty" required><input name="product_interest" placeholder="Produk diminati"><textarea name="notes" placeholder="Kebutuhan dan qty"></textarea><label><input name="consent" type="checkbox" required> Saya menyetujui pemrosesan data untuk inquiry/quotation.</label><label><input name="verified" type="checkbox" required> Saya menyelesaikan verifikasi manusia/OTP sesuai instruksi.</label><button>Kirim RFQ</button><p id="m"></p></form><script>const f=document.querySelector('#f'),m=document.querySelector('#m');f.addEventListener('submit',async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(f));x.consent=true;x.verified=true;x.items=[{product_id:document.querySelector('#p').value,qty:Number(document.querySelector('#q').value)}];const r=await fetch('/api/rfqs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});const d=await r.json();m.textContent=r.ok?'RFQ diterima: '+d.rfq_id:(d.error||'RFQ gagal')});fetch('/api/products').then(r=>r.json()).then(d=>{for(const p of d.products||[])document.querySelector('#p').insertAdjacentHTML('beforeend','<option value="'+p.id+'">'+p.name+'</option>')})});</script></body></html>
