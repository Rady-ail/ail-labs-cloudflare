<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" fill="#1d1c1a">
  <!-- AIL LABS supply skyline: warehouse racks → products & lab glass → cold chain & delivery.
       Drawn in Domus ink; cyan/orange are small accents only. Shown at low opacity behind content. -->

  <!-- Ground line -->
  <rect x="0" y="338" width="1600" height="2"/>

  <!-- Warehouse pallet rack -->
  <g>
    <rect x="40" y="110" width="8" height="230"/>
    <rect x="200" y="110" width="8" height="230"/>
    <rect x="360" y="110" width="8" height="230"/>
    <rect x="520" y="110" width="8" height="230"/>
    <rect x="40" y="180" width="488" height="6"/>
    <rect x="40" y="258" width="488" height="6"/>
    <rect x="40" y="110" width="488" height="4"/>
    <!-- top shelf boxes -->
    <rect x="58" y="138" width="62" height="42" rx="2"/>
    <rect x="124" y="150" width="58" height="30" rx="2"/>
    <rect x="218" y="132" width="70" height="48" rx="2"/>
    <rect x="292" y="146" width="52" height="34" rx="2"/>
    <rect x="380" y="140" width="64" height="40" rx="2"/>
    <rect x="448" y="128" width="56" height="52" rx="2"/>
    <!-- middle shelf boxes -->
    <rect x="58" y="214" width="84" height="44" rx="2"/>
    <rect x="146" y="226" width="40" height="32" rx="2"/>
    <rect x="218" y="220" width="56" height="38" rx="2"/>
    <rect x="278" y="208" width="66" height="50" rx="2"/>
    <rect x="380" y="216" width="124" height="42" rx="2"/>
    <!-- floor pallets -->
    <rect x="58" y="296" width="126" height="34" rx="2"/>
    <rect x="58" y="330" width="126" height="8"/>
    <rect x="218" y="284" width="60" height="46" rx="2"/>
    <rect x="282" y="300" width="62" height="30" rx="2"/>
    <rect x="218" y="330" width="126" height="8"/>
    <rect x="380" y="292" width="124" height="38" rx="2"/>
    <rect x="380" y="330" width="124" height="8"/>
    <!-- cold bay marker -->
    <rect x="448" y="128" width="56" height="6" fill="#0aa7b5"/>
  </g>

  <!-- Dropper bottle -->
  <rect x="600" y="250" width="50" height="90" rx="8"/>
  <rect x="612" y="236" width="26" height="16" rx="2"/>
  <rect x="616" y="200" width="18" height="38" rx="9"/>

  <!-- Pump bottle -->
  <rect x="670" y="210" width="60" height="130" rx="12"/>
  <rect x="685" y="196" width="30" height="16" rx="3"/>
  <rect x="696" y="176" width="8" height="22"/>
  <path d="M690 166h48v10h-48z"/>

  <!-- Cream jar -->
  <rect x="752" y="290" width="96" height="18" rx="4"/>
  <rect x="756" y="306" width="88" height="34" rx="8"/>

  <!-- Tube (standing on its cap) -->
  <rect x="884" y="318" width="32" height="22" rx="3"/>
  <path d="M876 318h48l8-118h-64z"/>
  <rect x="864" y="192" width="72" height="10" rx="2"/>

  <!-- Erlenmeyer flask with liquid -->
  <rect x="980" y="222" width="32" height="8" rx="2"/>
  <path d="M985 230h22v40l34 62q4 8-6 8h-78q-10 0-6-8l34-62z"/>
  <path d="M966 305h60l15 27q4 8-6 8h-78q-10 0-6-8z" fill="#0aa7b5"/>

  <!-- Vials -->
  <rect x="1060" y="296" width="16" height="44" rx="4"/>
  <rect x="1059" y="284" width="18" height="14" rx="2"/>
  <rect x="1084" y="286" width="16" height="54" rx="4"/>
  <rect x="1083" y="274" width="18" height="14" rx="2" fill="#f07b4f"/>
  <rect x="1108" y="300" width="16" height="40" rx="4"/>
  <rect x="1107" y="288" width="18" height="14" rx="2"/>

  <!-- Cold-chain box -->
  <rect x="1160" y="250" width="120" height="90" rx="6"/>
  <rect x="1152" y="236" width="136" height="18" rx="4"/>
  <rect x="1200" y="224" width="40" height="14" rx="7"/>
  <g stroke="#0aa7b5" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M1220 274v42M1202 284l36 22M1238 284l-36 22"/>
  </g>

  <!-- Route to client -->
  <path d="M1296 214C1370 150 1452 196 1528 128" fill="none" stroke="#f07b4f" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <path d="M1540 76a20 20 0 0 0-20 20c0 15 20 34 20 34s20-19 20-34a20 20 0 0 0-20-20zm0 12a8 8 0 1 1 0 16 8 8 0 0 1 0-16z" fill="#f07b4f" fill-rule="evenodd"/>

  <!-- Delivery van -->
  <rect x="1330" y="240" width="150" height="82" rx="6"/>
  <path d="M1484 262h46l30 32v28h-76z"/>
  <path d="M1492 270h34l22 24h-56z" fill="#0aa7b5"/>
  <circle cx="1372" cy="324" r="16"/>
  <circle cx="1522" cy="324" r="16"/>
</svg>
