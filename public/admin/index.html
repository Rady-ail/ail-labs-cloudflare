<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIL LABS Admin</title><style>body{font-family:system-ui;margin:0;background:#f6fbfb;color:#082f32}main{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#fff;border:1px solid #dce9e7;border-radius:14px;padding:16px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:9px;border-bottom:1px solid #e8f0ef;text-align:left}input,button,select{padding:10px;border:1px solid #dce9e7;border-radius:9px}button{background:#082f32;color:#fff;font-weight:800}#login{max-width:360px;margin:12vh auto}</style></head><body><main><section id="login" class="card"><h2>AIL LABS Admin</h2><input id="u" placeholder="Username"><input id="pw" type="password" placeholder="Password"><button id="go">Login</button><p id="msg"></p></section><section id="app" hidden><h1>B2B Sales & Procurement OS</h1><div class="grid"><div class="card">Leads <b id="lt">—</b><small id="lh"></small></div><div class="card">RFQ <b id="rt">—</b><small id="ro"></small></div></div><p><a href="/api/admin/leads.csv">Export Leads CSV</a> · <a href="/api/admin/rfqs.csv">Export RFQ CSV</a> · <button id="out">Logout</button></p><div class="card"><h3>Leads</h3><select id="ls"><option value="">All</option><option>New</option><option>Contacted</option><option>Qualified</option><option>Proposal</option><option>Won</option><option>Lost</option></select><div id="leads"></div></div><div class="card"><h3>RFQ</h3><div id="rfqs"></div></div></section></main><script>const $=x=>document.querySelector(x);async function j(u,o){const r=await fetch(u,o);return [r,await r.json().catch(()=>({}))]}async function load(){const[,d]=await j('/api/admin/dashboard');$('#lt').textContent=d.leads?.total??0;$('#lh').textContent=' HOT: '+(d.leads?.hot??0);$('#rt').textContent=d.rfqs?.total??0;$('#ro').textContent=' overdue: '+(d.rfqs?.overdue??0);const[,l]=await j('/api/admin/leads?status='+encodeURIComponent($('#ls').value));$('#leads').innerHTML='<table><tr><th>Company</th><th>Score</th><th>Tier</th><th>Status</th></tr>'+(l.leads||[]).map(x=>'<tr><td>'+x.company+'</td><td>'+x.score+'</td><td>'+x.tier+'</td><td>'+x.status+'</td></tr>').join('')+'</table>';const[,r]=await j('/api/admin/rfqs');$('#rfqs').innerHTML='<table><tr><th>Company</th><th>Status</th><th>Items</th></tr>'+(r.rfqs||[]).map(x=>'<tr><td>'+x.company+'</td><td>'+x.status+'</td><td>'+x.item_count+'</td></tr>').join('')+'</table>'}$('#go').onclick=async()=>{const[r,d]=await j('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#pw').value})});if(r.ok){$('#login').hidden=true;$('#app').hidden=false;load()}else $('#msg').textContent=d.error||'Login gagal'};$('#ls').onchange=load;$('#out').onclick=async()=>{await j('/api/admin/logout',{method:'POST'});location.reload()};</script></body></html>
