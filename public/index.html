<style id="ail-design-system">
:root{
  --bg:#FAFAF8;
  --surface:#FFFFFF;
  --surface-soft:#F5F6F4;
  --line:#E5E7EB;
  --text:#111827;
  --text-muted:#6B7280;
  --orange:#C2410C;
  --orange-hover:#9A3412;
  --orange-soft:#FFF7ED;
  --cyan:#0891B2;
  --cyan-text:#0E7490;
  --cyan-soft:#ECFEFF;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --radius-xs:8px;
  --radius-sm:12px;
  --radius-md:16px;
  --radius-lg:20px;
  --shadow-sm:0 1px 2px rgba(17,24,39,.04);
  --shadow-md:0 8px 24px rgba(17,24,39,.07);
  --ease:cubic-bezier(.2,.8,.2,1);
  --space-1:4px;--space-2:8px;--space-3:16px;--space-4:24px;
  --space-5:32px;--space-6:48px;--space-7:64px;--space-8:96px;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{min-height:44px}
a{color:var(--cyan-text)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:40;padding:var(--space-2) 16px;background:rgba(250,250,248,.96);border-bottom:1px solid var(--line)}
.topbar-row{display:block;max-width:1200px;margin:0 auto}
.topbar-inner{width:100%;display:flex;min-height:48px;padding:4px 4px 4px 8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--shadow-sm)}
.brand-mark{width:32px;height:32px;background:transparent;border-radius:var(--radius-xs)}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.topbar-actions{gap:4px}
.icon-btn{width:44px;height:44px;border-radius:var(--radius-xs);background:transparent;border:0;color:var(--text);display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--surface-soft)}
.chip-scroller{background:transparent;border:0;box-shadow:none;overflow-x:auto;scrollbar-width:none;padding:var(--space-2) 0}
.chip-scroller::-webkit-scrollbar{display:none}
.chip{min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text-muted);font-weight:600}
.chip.active{background:var(--cyan-soft);color:var(--cyan-text);border-color:var(--cyan)}
.search-wrap{transition:max-height .2s var(--ease)}
.search-bar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:none}
.search-bar input{color:var(--text)}

.hero-card{margin:0 0 var(--space-6);padding:clamp(32px,6vw,64px);min-height:390px;display:flex;align-items:center;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.hero-body{max-width:820px;margin:0}
.hero-brandline{display:flex;align-items:center;gap:10px;margin-bottom:var(--space-4)}
.hero-kicker{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--text-muted)}
.hero-kicker-muted{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--text-muted)}
.hero-rule{width:32px;height:1px;background:var(--orange);display:block}
.hero-card h1{margin:0;max-width:800px;font-size:clamp(34px,5vw,60px);line-height:1.2;letter-spacing:-.035em;font-weight:700;color:var(--text)}
.hero-sub{max-width:680px;margin:18px 0 26px;font-size:16px;line-height:1.5;color:var(--text-muted)}
.hero-actions{display:flex;flex-wrap:wrap;gap:var(--space-2)}

.hero-actions .primary,.checkout-btn,.btn-reorder{background:var(--orange);color:#fff;border:1px solid var(--orange)}
.hero-actions .primary:hover,.checkout-btn:hover,.btn-reorder:hover{background:var(--orange-hover)}
.hero-actions .secondary{background:var(--surface);color:var(--text);border:1px solid var(--orange)}
.hero-actions .secondary:hover{background:var(--orange-soft);border-color:var(--orange)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 12px;margin:var(--space-5) 0 var(--space-3);border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}

.section-count{font-size:12px;color:var(--text-muted)}

.row{min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:0 0 var(--space-3);margin:0;overflow:hidden;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);transition:transform .2s var(--ease),box-shadow .2s ease,border-color .2s ease}

.row-thumb-placeholder{min-height:150px;display:flex;align-items:center;justify-content:center}
.row-body{padding:0 var(--space-3);min-height:122px;display:flex;flex-direction:column}
.row-name{margin:0;color:var(--text);font-weight:700;font-size:15px;line-height:1.35}

.row-price{display:inline-flex;align-items:center;width:max-content;max-width:100%;padding:4px 8px;border-radius:999px;background:var(--orange-soft);color:var(--orange-hover);font-size:13.5px;font-weight:700}
.row-price-locked{display:inline-flex;align-items:center;min-height:28px;padding:5px 9px;background:var(--orange-soft);border:1px solid #FED7AA;color:var(--orange-hover);border-radius:999px}
.wish-btn{margin:0 10px 0 auto;min-width:44px;min-height:44px;border:0;border-radius:var(--radius-xs);background:transparent;color:var(--text)}
.wish-btn:hover{background:var(--cyan-soft);color:var(--text)}
.cart-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}

.cart-row-name{font-weight:700;font-size:14.5px;margin:0;color:var(--text)}

.qty-btn{display:inline-flex;align-items:center;justify-content:center;min-width:32px;min-height:32px;border:1px solid var(--line);border-radius:var(--radius-xs);background:var(--surface)}
.cart-subtotal{font-weight:700;color:var(--orange)}
.cart-remove,.clear-history-btn{border:0;background:transparent;color:var(--text-muted);cursor:pointer}
.cart-remove:hover,.clear-history-btn:hover{text-decoration:underline}
.info-card,.cart-summary,.order-card,.bank-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--shadow-sm)}
.info-card h2{margin-top:0}
.form-field{margin-bottom:var(--space-3)}

.toast{position:fixed;left:50%;bottom:96px;z-index:120;transform:translateX(-50%);background:var(--text);color:#fff;font-size:13.5px;font-weight:600;padding:12px 20px;border-radius:999px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;display:flex;gap:4px;padding:6px;border-radius:999px;z-index:50;width:min(calc(100% - 24px),520px);justify-content:space-between;background:rgba(255,255,255,.96);border:1px solid var(--line);box-shadow:var(--shadow-md)}

<div id="bootFallback" style="display:none;padding:60px 20px;text-align:center;font-family:-apple-system,system-ui,sans-serif;color:#153237">
  <p style="font-weight:700;margin-bottom:8px">Gagal memuat halaman</p>
  <p style="font-size:13px;color:#8A8A8E;margin-bottom:16px">Cek koneksi internet, lalu coba muat ulang.</p>
  <p id="bootErrorDetail" style="font-size:11px;color:#B13A2C;margin-bottom:16px;word-break:break-word;text-align:left;background:#FBEAEA;padding:10px;border-radius:8px;display:none"></p>

</div>
<script>
  function showBootError(detail){
    if(!document.getElementById('root').hasChildNodes()){
      document.getElementById('bootFallback').style.display = 'block';
      if(detail){
        var el = document.getElementById('bootErrorDetail');
        el.textContent = detail;
        el.style.display = 'block';
      }
    }
  }
  window.addEventListener('error', function(e){
    var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Unknown error';
    console.error('Boot error:', e.error || e.message);
    showBootError(msg);
  });
  window.addEventListener('unhandledrejection', function(e){
    var msg = (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason);
    console.error('Boot rejection:', e.reason);
    showBootError(msg);
  });
  setTimeout(function(){ showBootError(null); }, 15000);
</script>

function cartKey(cat, name, kemasan){ return cat + '__' + name + '__' + kemasan; }
const fmt = n => (n === null || n === undefined) ? "Login untuk lihat harga" : "Rp " + n.toLocaleString('id-ID');
function generateInvoiceNo(){ const now = new Date(); return 'PO-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '-' + Math.floor(1000 + Math.random()*9000); }
function buildPOMessage(items, total, name, note, invoice){
  let header = `==========================================\n        PURCHASE ORDER REQUISITION       \n   PT FUDHAIL AESTHETIC LABORATORIES     \n==========================================\n\n• No. Invoice   : ${invoice || '-'}\n• Nama / Klinik : ${name || '-'}\n• Catatan       : ${note || '-'}\n\n[ITEM LIST]\n`;
  const footer = `\n------------------------------------------\nTOTAL RINCIAN   : ${fmt(total)}\n------------------------------------------\n==========================================\n\nMohon diinfokan langkah selanjutnya untuk penyelesaian \npesanan ini.\n\nTerima kasih atas bantuannya! 🙏`;
  const itemLines = items.map(it => `• ${it.name} (${it.kemasan})\n  Qty: ${it.qty} | Harga: ${fmt(it.harga)}\n`);
  let body = itemLines.join('');
  if((header + body + footer).length > WA_MESSAGE_SAFE_LIMIT && items.length > 1){
    let acc = '', shown = 0;
    for(const line of itemLines){ if((header + acc + line + footer).length > WA_MESSAGE_SAFE_LIMIT) break; acc += line; shown++; }
    const remaining = items.length - shown;
    if(remaining > 0 && shown > 0){ body = acc + `• ...dan ${remaining} produk lainnya\n`; body += `  (rincian lengkap ada di struk PDF/invoice ${invoice || ''})\n`; }
  }
  return header + body + footer;
}
function openWA(msg){
  const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  try{ const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; document.body.appendChild(a); a.click(); a.remove(); }
  catch(e){ window.open(url, '_blank', 'noopener,noreferrer'); }
}
function formatHistoryDate(iso){ const d = new Date(iso); return d.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }) + ' · ' + d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }); }
function loadJSON(key, fallback){ try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch(e){ return fallback; } }
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }
async function postOrderToServer(payload){ const res = await fetch('/api/orders', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) }); if(!res.ok) throw new Error('HTTP ' + res.status); }
function groupsInCatalogFrom(catalog){ const present = new Set(catalog.map(g=>groupOf(g.cat))); return Array.from(present).sort((a,b)=>a.localeCompare(b,'id')); }
function catsInGroupFrom(catalog, g){ return catalog.map(x=>x.cat).filter(c=>groupOf(c)===g).sort((a,b)=>a.localeCompare(b,'id')); }

/* ================= Motion (motion.dev) untuk React ================= */
/* Dimuat dinamis (bukan static import) supaya kalau CDN gagal, seluruh app
   tetap jalan normal tanpa animasi — bukan error/blank page. */
function useMotionLib(){
  const [lib, setLib] = useState(null);
  useEffect(()=>{
    let alive = true;
    import("https://cdn.jsdelivr.net/npm/motion@11/react/+esm")
      .then(m => { if(alive) setLib(m); })
      .catch(()=>{ /* CDN gagal: lib tetap null, UI pakai fallback tanpa animasi */ });
    return ()=>{ alive = false; };
  }, []);
  return lib;
}

/* Elemen yang bisa dianimasikan Motion kalau lib berhasil dimuat, atau tampil
   biasa (tanpa animasi, tanpa error) kalau CDN gagal. Dipakai untuk toast &
   modal-card supaya keduanya konsisten pakai satu pola yang sama. */
function Animated({ motionLib, show, keyName, className, id, initial, animate, exit, transition, onClick, children }){
  if(motionLib){
    const { motion, AnimatePresence } = motionLib;
    return (
      <AnimatePresence>
        {show && (
          <motion.div key={keyName} className={className} id={id} onClick={onClick}
            initial={initial} animate={animate} exit={exit} transition={transition}>
            {children}
          </motion.div>
        )}
      </AnimatePresence>
    );
  }
  return show ? <div className={className} id={id} onClick={onClick}>{children}</div> : null;
}

/* ================= Komponen kecil ================= */
function Toast({ msg, visible, motionLib }){
  return (
    <Animated motionLib={motionLib} show={visible} keyName="toast" className="toast" id="toast"
      initial={{ opacity:0, x:'-50%', y:16 }}
      animate={{ opacity:1, x:'-50%', y:0 }}
      exit={{ opacity:0, x:'-50%', y:16, transition:{ duration:.16, ease:'easeIn' } }}
      transition={{ type:'spring', stiffness:420, damping:36, mass:.8 }}>
      <span id="toastMsg">{msg}</span>
    </Animated>
  );
}

  /* --- auth --- */

  async function submitLoginProfile(){

      setCurrentUser(data); setProfileForm(f=>({...f, error:''})); showToast(`Selamat datang di AIL LABS, ${clinic_name}!`);
    } catch(err){ setProfileForm(f=>({...f, error: err.message || 'Terjadi kesalahan, coba lagi.'})); }
  }
  async function saveProfileEdit(){
    const clinic_name = profileEditForm.clinic_name.trim();
    const phone = profileEditForm.phone.trim();
    if(!clinic_name || !phone){ setProfileEditForm(f=>({...f, error:'Nama klinik/apotek dan nomor WhatsApp wajib diisi.'})); return; }
    try{
      const res = await fetch('/api/customer/auth/complete-profile', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ clinic_name, phone }) });

      setCurrentUser(data); showToast('Profil berhasil diperbarui'); closeProfileModal();
    } catch(err){ setProfileEditForm(f=>({...f, error: err.message || 'Terjadi kesalahan, coba lagi.'})); }
  }
  function onGoogleLoginFromModal(){
    if(!currentUser){ window.location.href = '/api/customer/auth/google'; return; }
    closeProductModal(); openLoginModal();
  }

  /* --- katalog --- */
  async function loadCatalogFromAPI(){
    setCatalogLoading(true);
    setCatalogError('');
    try{
      const res = await fetch('/api/products', { credentials:'include', cache:'no-store' });
      const raw = await res.json().catch(()=>null);
      if(!res.ok) throw new Error((raw && raw.error) || 'Gagal memuat katalog (HTTP ' + res.status + ')');
      if(!Array.isArray(raw)) throw new Error('Format katalog tidak valid.');

      // API produksi mengembalikan grouped rows: [{cat,items:[...]}].
      // Normalizer ini juga menerima format flat object tanpa mengubah data lama.
      const normalized = raw.map((entry) => {
        if(entry && typeof entry === 'object' && Array.isArray(entry.items)){
          return {
            cat: String(entry.cat || 'Lainnya'),
            items: entry.items.filter(Array.isArray).map(item => [
              item[0] == null ? '' : String(item[0]),
              item[1] == null ? '' : String(item[1]),
              item[2] == null ? '' : String(item[2]),
              item[3] == null ? null : Number(item[3]),
              item[4] || null
            ]).filter(item => item[0])
          };
        }
        if(entry && typeof entry === 'object' && entry.name){
          return {
            cat: String(entry.cat || entry.category_name || 'Lainnya'),
            items: [[
              String(entry.name),
              String(entry.kandungan || ''),
              String(entry.kemasan || ''),
              entry.harga == null ? null : Number(entry.harga),
              entry.foto || entry.image_url || null
            ]]
          };
        }
        return null;
      }).filter(group => group && group.items.length);

      if(!normalized.length) throw new Error('Katalog kosong.');
      setCatalog(normalized);
      const nextGroups = groupsInCatalogFrom(normalized);
      setActiveGroup(current => current && nextGroups.includes(current) ? current : (nextGroups[0] || null));
      setActiveCat('Semua');
      setCatalogUnlocked(true);
    } catch(err){
      console.error('Catalog API error:', err);
      setCatalog([]);
      setCatalogUnlocked(false);
      setCatalogError(err.message || 'Katalog gagal dimuat.');
    } finally {
      setCatalogLoading(false);
    }
  }

  useEffect(()=>{ checkAuthStatus(); loadCatalogFromAPI(); retryPendingOrderSync(); }, []);

  const groups = groupsInCatalogFrom(catalog);
  const cats = activeGroup ? catsInGroupFrom(catalog, activeGroup) : [];

  function handleGroupClick(g){
    if(activeGroup === g) return;
    setActiveGroup(g); setActiveCat('Semua'); setCatalogUnlocked(false);
  }
  function handleCatClick(c){
    setActiveCat(c); setCatalogUnlocked(true);
    if(c !== 'Semua'){ setTimeout(()=>{ const el = document.getElementById('sec-'+slug(c)); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }, 50); }
  }

  /* --- wishlist --- */
  function toggleWishlistItem(cat, name, kemasan, harga){
    const key = cartKey(cat, name, kemasan);
    let active;
    setWishlist(w=>{
      const next = {...w};
      if(next[key]){ delete next[key]; active = false; } else { next[key] = { cat, name, kemasan, harga }; active = true; }
      return next;
    });
    return active;
  }
  function handleRowWish(cat, name, kemasan, harga){
    const willRemove = !!wishlist[cartKey(cat, name, kemasan)];
    toggleWishlistItem(cat, name, kemasan, harga);
    showToast(willRemove ? name + ' dihapus dari wishlist' : name + ' disimpan ke wishlist');
  }
  function handleModalWish(state){
    const willRemove = !!wishlist[cartKey(state.cat, state.name, state.kemasan)];
    toggleWishlistItem(state.cat, state.name, state.kemasan, state.harga);
    showToast(willRemove ? 'Dihapus dari wishlist' : 'Disimpan ke wishlist');
  }
  function moveWishlistToCart(key){
    const it = wishlist[key]; if(!it) return;
    addToCart(it.cat, it.name, it.kemasan, it.harga, 1);
    showToast(it.name + ' ditambahkan ke keranjang');
  }
  function removeWishlistItem(key){ setWishlist(w=>{ const next = {...w}; delete next[key]; return next; }); }

  /* --- cart --- */
  function addToCart(cat, name, kemasan, harga, qty){
    const key = cartKey(cat, name, kemasan);
    setCart(c=>{
      const next = {...c};
      if(next[key]){ next[key] = {...next[key], qty: next[key].qty + qty}; } else { next[key] = { name, kemasan, harga, qty }; }
      return next;
    });
  }
  function changeCartQty(key, delta){
    setCart(c=>{
      if(!c[key]) return c;
      const next = {...c};
      const newQty = next[key].qty + delta;
      if(newQty <= 0){ delete next[key]; } else { next[key] = {...next[key], qty:newQty}; }
      return next;
    });
  }

  async function retryPendingOrderSync(){
    const pending = loadJSON(PENDING_ORDERS_KEY, []);
    if(pending.length === 0) return;
    const stillFailed = [];
    for(const payload of pending){ try{ await postOrderToServer(payload); } catch(err){ stillFailed.push(payload); } }
    saveJSON(PENDING_ORDERS_KEY, stillFailed);
  }
  async function syncOrderToServer(payload){
    try{ await postOrderToServer(payload); }
    catch(err){ const pending = loadJSON(PENDING_ORDERS_KEY, []); pending.push(payload); saveJSON(PENDING_ORDERS_KEY, pending); }
  }

    setCheckoutInProgress(true);
    let total = 0;
    const orderItems = [];
    cartKeys.forEach(key=>{ const it = cart[key]; const cat = key.split('__')[0]; total += it.harga * it.qty; orderItems.push({ cat, name: it.name, kemasan: it.kemasan, harga: it.harga, qty: it.qty }); });

  /* --- PayPal (lazy-load SDK, sama seperti sebelumnya) --- */
  async function loadPaypalSdk(){
    const st = paypalStateRef.current;
    if(st.loaded) return true;
    if(st.loading) return st.loading;
    st.loading = (async () => {
      try{
        if(!st.config){ const res = await fetch('/api/paypal/config'); if(!res.ok) return false; st.config = await res.json(); }
        await new Promise((resolve, reject) => {
          const existing = document.querySelector('script[data-paypal-sdk]');
          if(existing){ resolve(); return; }
          const script = document.createElement('script');
          script.setAttribute('data-paypal-sdk', 'true');
          script.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(st.config.clientId)}&currency=${encodeURIComponent(st.config.currency || 'USD')}`;
          script.onload = resolve; script.onerror = reject;
          document.head.appendChild(script);
        });
        st.loaded = true; return true;
      } catch(err){ console.error('Gagal memuat PayPal SDK:', err); return false; }
      finally { st.loading = null; }
    })();
    return st.loading;
  }

    container.innerHTML = '';

    }).render(container);
  }

      <main className={"view" + (activeView==='wishlist' ? " active" : "")} id="view-wishlist">
        <div className="section-head glass" style={{paddingTop:'20px'}}>
          <button className="back-chip" type="button" onClick={()=> switchView('katalog','katalog')}><UiIcon name="back" size={16} /> Kembali</button>
          <span className="section-count">{Object.keys(wishlist).length} produk</span>
        </div>
        <h1 className="view-title">Wishlist Saya</h1>
        <div id="wishlistContent">
          {Object.keys(wishlist).length === 0 ? (
            <div className="cart-empty" style={{textAlign:'center', padding:'60px 20px'}}>Belum ada produk favorit.</div>
          ) : (
            <div className="group glass">
              {Object.keys(wishlist).map(key=>{
                const it = wishlist[key];
                return (
                  <div className="cart-row" key={key}>
                    <div className="cart-row-main"><p className="cart-row-name">{it.name}</p><p className="cart-row-price">{it.kemasan} · {fmt(it.harga)}</p></div>
                    <div className="cart-row-trail">
                      <button className="wish-add-btn" type="button" onClick={()=> moveWishlistToCart(key)}>+ Keranjang</button>
                      <button className="cart-remove" type="button" onClick={()=> removeWishlistItem(key)}>Hapus</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </main>

      <main className={"view" + (activeView==='riwayat' ? " active" : "")} id="view-riwayat">
        <div className="section-head glass" style={{paddingTop:'20px'}}>
          <button className="back-chip" type="button" onClick={()=> switchView('cart','cart')}><UiIcon name="back" size={16} /> Kembali</button>
          <button className="clear-history-btn" type="button" onClick={clearHistory}>Hapus Semua</button>
        </div>
        <h1 className="view-title">Riwayat Pesanan</h1>
        <div id="historyContent">
          {history.length === 0 ? (
            <div className="cart-empty" style={{textAlign:'center', padding:'60px 20px'}}>Belum ada riwayat pesanan.</div>
          ) : history.map(order=>{
            const totalQty = order.items.reduce((s,i)=>s+i.qty, 0);
            return (
              <div className="info-card glass order-card" style={{marginBottom:'12px', padding:'18px'}} key={order.id}>
                <div className="order-meta" style={{display:'flex', justifyContent:'space-between', fontSize:'11px', color:'var(--text-muted)'}}><span>{formatHistoryDate(order.date)}</span><span>{totalQty} item</span></div>
                <p className="order-items" style={{fontSize:'12.5px'}}>{order.items.map((it,i)=> <React.Fragment key={i}>{it.qty}× {it.name} ({it.kemasan})<br/></React.Fragment>)}</p>
                <div className="order-total" style={{display:'flex', justifyContent:'space-between', fontWeight:700}}><span>Total</span><span>{fmt(order.total)}</span></div>
                <div className="order-actions" style={{display:'flex', gap:'8px', marginTop:'10px'}}>
                  <button className="btn-reorder" type="button" style={{flex:1, border:'none', borderRadius:'999px', padding:'11px', background:'var(--cyan)', color:'#fff', cursor:'pointer'}} onClick={()=> reorderHistory(order.id)}>Pesan Lagi</button>
                  <button className="btn-wa" type="button" style={{flex:1, border:'none', borderRadius:'999px', padding:'11px', background:'rgba(116,173,180,.14)', cursor:'pointer'}} onClick={()=> resendHistoryWA(order.id)}>Kirim Ulang</button>
                </div>
              </div>
            );
          })}
        </div>
      </main>

      <nav className="tabbar glass" id="tabbar">
        <button className={"tab" + (activeTab==='katalog' ? " active" : "")} onClick={()=> handleTabClick('katalog')}><UiIcon name="grid" size={22} /><br/>Katalog</button>
        {isApproved && <button className={"tab" + (activeTab==='cart' ? " active" : "")} onClick={()=> handleTabClick('cart')}>{cartCount > 0 && <span className="tab-badge">{cartCount}</span>}<UiIcon name="cart" size={22} /><br/>Keranjang</button>}
        {!isApproved && <button className={"tab" + (activeTab==='login' ? " active" : "")} onClick={()=> handleTabClick('login')}><UiIcon name="user" size={22} /><br/>Masuk</button>}
        {isApproved && <button className={"tab" + (activeTab==='riwayat' ? " active" : "")} onClick={()=> handleTabClick('riwayat')}><UiIcon name="clock" size={22} /><br/>Riwayat</button>}
        <button className={"tab" + (activeTab==='info' ? " active" : "")} onClick={()=> handleTabClick('info')}><UiIcon name="info" size={22} /><br/>Disclaimer</button>
      </nav>
    </React.Fragment>
  );
}

createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
(function(){
  try{
    var reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var blocks=document.querySelectorAll('.section-block');
    if(reduced || !('IntersectionObserver' in window)){blocks.forEach(function(el){el.classList.add('is-visible')});return;}
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){if(entry.isIntersecting){entry.target.classList.add('is-visible');io.unobserve(entry.target);}});
    },{rootMargin:'0px 0px -8% 0px',threshold:.04});
    blocks.forEach(function(el){io.observe(el)});
  }catch(e){}
})();
</script>
<script src="/visitor-tracker.js"></script>

</body>
</html>
