ex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none}.modal-overlay.open{opacity:1;pointer-events:auto}.modal-card{width:100%;max-width:420px;border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:22px 20px;max-height:86vh;overflow-y:auto;background:#fff}.toast{position:fixed;left:50%;bottom:96px;z-index:120;transform:translateX(-50%);opacity:1;background:var(--green-900);color:#fff;font-size:13.5px;font-weight:600;padding:12px 20px;border-radius:999px}.cart-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(21,50,55,.08)}.form-field input,.form-field textarea{width:100%;border:1.5px solid rgba(21,50,55,.14);border-radius:var(--radius-sm);padding:11px 13px;font-family:inherit;font-size:13.5px}.bank-card{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--radius-md)}.google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid rgba(21,50,55,.14);border-radius:999px;padding:14px;background:#fff;font-weight:700;cursor:pointer}.row-price-locked{font-size:11px;font-weight:700;color:var(--green-700);background:#EAF1F1;padding:5px 10px;border-radius:999px}body.guest-mode #wishlistToggle,body.guest-mode .tab[data-tab="cart"],body.guest-mode .tab[data-tab="riwayat"]{display:none!important}body:not(.guest-mode) #loginTab{display:none!important}#logoutBtn,#profileToggle{display:none!important}body.logged-in #logoutBtn,body.logged-in #profileToggle{display:flex!important}.pending-banner{display:flex;gap:10px;background:#FBF1DF;padding:12px 14px;border-radius:14px;margin:0 16px 12px}
/* --- Perbaikan tampilan: elemen ini dipakai HTML/JS tapi sebelumnya tidak punya gaya, jadi terlihat berantakan --- */
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.chip{transition:background .18s var(--spring),color .18s var(--spring)}
.chip.active{background:var(--green-700);color:#fff}
.tabbar{background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(21,50,55,.18);border:1px solid var(--glass-border)}
.row{align-items:center}
.row-thumb{object-fit:cover;flex-shrink:0;background:#EEF3F2}
.hero-card{box-shadow:0 18px 44px rgba(21,50,55,.24)}
.checkout-btn{transition:transform .15s var(--spring),opacity .15s}
.checkout-btn:active{transform:scale(.98)}
.checkout-btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{transition:background .15s}
.icon-btn:active{background:#EEF1F1}
.modal-card{box-shadow:0 -12px 40px rgba(21,50,55,.2)}
.modal-overlay{transition:opacity .22s ease}

/* --- Token tambahan: spacing & shadow, dipakai untuk rapikan kartu produk, form, navbar --- */
:root{--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--shadow-sm:0 2px 8px rgba(21,50,55,.08)}

/* Kartu produk (.row di daftar katalog & .cart-row di keranjang/wishlist) */
.row{gap:var(--space-3);padding:var(--space-3) var(--space-4);transition:background .15s var(--spring)}
.row:active{background:rgba(116,173,180,.1)}
.row:last-child{border-bottom:none}
.row-name{color:var(--ink-900)}
.row-price{font-size:14px}
.cart-row{transition:background .15s var(--spring)}
.cart-row:active{background:rgba(116,173,180,.08)}
.cart-row:last-child{border-bottom:none}
.cart-row-name{font-family:var(--font-display);font-weight:600;font-size:14.5px;margin:0;color:var(--ink-900)}
.cart-row-price{font-size:12px;color:var(--ink-600);margin:2px 0 0}

/* Form (label + input/textarea di semua modal & form pemesan) */
.form-field{margin-bottom:var(--space-4)}
.form-field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-600);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.form-field input,.form-field textarea{transition:border-color .15s var(--spring),box-shadow .15s var(--spring)}
.form-field input:focus,.form-field textarea:focus{outline:none;border-color:var(--emerald-600);box-shadow:0 0 0 3px rgba(64,119,103,.14)}

/* Navbar (.tabbar/.tab) — transisi active tab konsisten dengan modal */
.tab{transition:background .18s var(--spring),color .18s var(--spring),transform .12s var(--spring)}
.tab:active{transform:scale(.94)}

/* ============================================================
   REDESAIN: Full Glassmorphism — Futuristic & Elegant
   Setiap "card" jadi kaca beku (frosted glass) mengambang di atas
   latar gradien aurora bernuansa brand (green/emerald/gold/silver).
   ============================================================ */
:root{
  --glass-fill:rgba(255,255,255,.58);
  --glass-fill-soft:rgba(255,255,255,.40);
  --glass-edge:rgba(255,255,255,.70);
  --glass-edge-soft:rgba(255,255,255,.26);
  --glass-shadow:0 10px 34px rgba(6,20,22,.22), 0 1px 0 rgba(255,255,255,.55) inset;
  --glass-shadow-sm:0 6px 20px rgba(6,20,22,.18), 0 1px 0 rgba(255,255,255,.45) inset;
  --glass-dark-fill:linear-gradient(158deg, rgba(34,76,82,.62), rgba(13,34,38,.58));
  --glass-dark-edge:rgba(255,255,255,.16);
  --glass-shadow-dark:0 16px 42px rgba(4,14,16,.4), 0 1px 0 rgba(255,255,255,.1) inset;
  --blur-lg:blur(26px) saturate(180%);
  --blur-md:blur(16px) saturate(170%);
}

html{background:#0B1E21}
body{
  background:
    radial-gradient(900px 620px at 6% -8%,rgba(92,163,137,.4),transparent 60%),
    radial-gradient(760px 640px at 106% 4%,rgba(240,210,140,.24),transparent 58%),
    radial-gradient(900px 780px at 46% 122%,rgba(116,173,180,.30),transparent 62%),
    linear-gradient(178deg,#0D2226 0%,#153237 46%,#0F2529 100%);
  min-height:100vh;
}

/* Base kaca terang — dipakai section-head, modal, form, ringkasan, bank */
.glass{
  background:linear-gradient(158deg,var(--glass-fill),var(--glass-fill-soft));
  border:1px solid var(--glass-edge-soft);
  border-top-color:var(--glass-edge);
  -webkit-backdrop-filter:var(--blur-lg);
  backdrop-filter:var(--blur-lg);
  box-shadow:var(--glass-shadow);
}

/* Kaca gelap — panel hero & kontak, tetap terbaca di atas gradien gelap */
.hero-card,.contact-card{
  background:var(--glass-dark-fill)!important;
  border:1px solid var(--glass-dark-edge);
  border-top-color:rgba(255,255,255,.26);
  -webkit-backdrop-filter:var(--blur-lg);
  backdrop-filter:var(--blur-lg);
  box-shadow:var(--glass-shadow-dark);
}
.hero-badge{background:rgba(255,255,255,.75)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 4px 14px rgba(6,20,22,.25)}
.cert-pill{background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* Daftar produk & keranjang: tiap baris = kartu kaca sendiri (bukan list panel) */
.group{background:transparent!important;border:none!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;display:flex;flex-direction:column;gap:10px}
.row,.cart-row{
  margin:0;border-radius:var(--radius-lg)!important;border-bottom:none!important;
  background:linear-gradient(158deg,var(--glass-fill),var(--glass-fill-soft));
  border:1px solid var(--glass-edge-soft);border-top-color:var(--glass-edge);
  -webkit-backdrop-filter:var(--blur-md);backdrop-filter:var(--blur-md);
  box-shadow:var(--glass-shadow-sm);
  transition:transform .18s var(--spring),box-shadow .18s var(--spring);
}
.row:active,.cart-row:active{transform:scale(.985);box-shadow:0 3px 12px rgba(6,20,22,.16),0 1px 0 rgba(255,255,255,.4) inset}

/* Navbar, chip kategori, search, header: kaca tipis biar ringan di mata */
.topbar-inner,.chip-scroller,.search-bar,.tabbar,.section-head{
  background:linear-gradient(158deg,rgba(255,255,255,.50),rgba(255,255,255,.30))!important;
  -webkit-backdrop-filter:var(--blur-md);backdrop-filter:var(--blur-md);
  border:1px solid var(--glass-edge-soft);border-top-color:var(--glass-edge);
}
.tabbar{box-shadow:var(--glass-shadow)}
.icon-btn{background:rgba(255,255,255,.55)!important;border:1px solid var(--glass-edge-soft)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* Modal: overlay ikut blur supaya kartu kaca terasa melayang */
.modal-overlay{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal-card{border-radius:var(--radius-xl) var(--radius-xl) 0 0!important}

/* Bank & info card kecil ikut kaca senada */
.bank-card{background:rgba(255,255,255,.4)!important;border:1px solid var(--glass-edge-soft);border-top-color:var(--glass-edge)}

  <p style="font-weight:700;margin-bottom:8px">Gagal memuat halaman</p>
  <p style="font-size:13px;color:#8A8A8E;margin-bottom:16px">Cek koneksi internet, lalu coba muat ulang.</p>
  <p id="bootErrorDetail" style="font-size:11px;color:#B13A2C;margin-bottom:16px;word-break:break-word;text-align:left;background:#FBEAEA;padding:10px;border-radius:8px;display:none"></p>

<script>
  function showBootError(detail){
    if(!document.getElementById('root').hasChildNodes()){
      document.getElementById('bootFallback').style.display = 'block';
      if(detail){
        var el = document.getElementById('bootErrorDetail');
        el.textContent = detail;
        el.style.display = 'block';
      }
    }
  }
  window.addEventListener('error', function(e){
    var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Unknown error';
    console.error('Boot error:', e.error || e.message);
    showBootError(msg);
  });
  window.addEventListener('unhandledrejection', function(e){
    var msg = (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason);
    console.error('Boot rejection:', e.reason);
    showBootError(msg);
  });
  setTimeout(function(){ showBootError(null); }, 15000);
</script>

<script type="text/babel" data-type="module" data-presets="react">
import * as React from "https://cdn.jsdelivr.net/npm/react@19.0.0/+esm";
import { createRoot } from "https://cdn.jsdelivr.net/npm/react-dom@19.0.0/client/+esm";
const { useState, useEffect, useRef } = React;

function UiIcon({ name, size=20, filled=false }){

      {name==='grid' && <><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></>}
      {name==='user' && <><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></>}
      {name==='info' && <><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></>}
      {name==='cart' && <><path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 1.9-1.4L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></>}
      {name==='clock' && <><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></>}
      {name==='search' && <><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></>}
      {name==='heart' && <path d="M20.8 8.7c0 5-8.8 10.1-8.8 10.1S3.2 13.7 3.2 8.7a4.6 4.6 0 0 1 8.8-1.8 4.6 4.6 0 0 1 8.8 1.8Z"/>}
      {name==='package' && <><path d="m12 3 9 4.5v9L12 21l-9-4.5v-9L12 3Z"/><path d="m3.5 7.7 8.5 4.4 8.5-4.4"/><path d="M12 12v9"/><path d="m7.5 5.3 9 4.5"/></>}
      {name==='logout' && <><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M12 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/></>}
      {name==='plus' && <><path d="M12 5v14"/><path d="M5 12h14"/></>}

}

/* ================= Konstanta & helper (persis logika lama) ================= */
const CATEGORY_GROUP_MAP = { "Cannula":"Threadlift & Consumable Medis", "Needle":"Threadlift & Consumable Medis", "Threadlift":"Threadlift & Consumable Medis", "Filler":"Filler & Skinbooster", "Skinbooster":"Filler & Skinbooster", "Body Lotion":"Body Care & Slimming", "Slimming":"Body Care & Slimming" };
const DEFAULT_GROUP = "Skincare & Perawatan Wajah";
const WA_NUMBER = '62818455559';
const WA_MESSAGE_SAFE_LIMIT = 1500;
const WISHLIST_STORAGE_KEY = 'ailLabsWishlist';
const CART_STORAGE_KEY = 'ailLabsCart';
const HISTORY_STORAGE_KEY = 'ailLabsOrderHistory';
const PENDING_ORDERS_KEY = 'ailLabsPendingOrderSync';
const BANK_ACC_NO = '7215584640';

function groupOf(cat){ return CATEGORY_GROUP_MAP[cat] || DEFAULT_GROUP; }
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }
function cartKey(cat, name, kemasan){ return cat + '__' + name + '__' + kemasan; }
const fmt = n => (n === null || n === undefined) ? "Login untuk lihat harga" : "Rp " + n.toLocaleString('id-ID');
function generateInvoiceNo(){ const now = new Date(); return 'PO-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '-' + Math.floor(1000 + Math.random()*9000); }
function buildPOMessage(items, total, name, note, invoice){
  let header = `==========================================\n        PURCHASE ORDER REQUISITION       \n   PT FUDHAIL AESTHETIC LABORATORIES     \n==========================================\n\n• No. Invoice   : ${invoice || '-'}\n• Nama / Klinik : ${name || '-'}\n• Catatan       : ${note || '-'}\n\n[ITEM LIST]\n`;
  const footer = `\n------------------------------------------\nTOTAL RINCIAN   : ${fmt(total)}\n------------------------------------------\n==========================================\n\nMohon diinfokan langkah selanjutnya untuk penyelesaian \npesanan ini.\n\nTerima kasih atas bantuannya! 🙏`;
  const itemLines = items.map(it => `• ${it.name} (${it.kemasan})\n  Qty: ${it.qty} | Harga: ${fmt(it.harga)}\n`);
  let body = itemLines.join('');
  if((header + body + footer).length > WA_MESSAGE_SAFE_LIMIT && items.length > 1){
    let acc = '', shown = 0;
    for(const line of itemLines){ if((header + acc + line + footer).length > WA_MESSAGE_SAFE_LIMIT) break; acc += line; shown++; }
    const remaining = items.length - shown;
    if(remaining > 0 && shown > 0){ body = acc + `• ...dan ${remaining} produk lainnya\n`; body += `  (rincian lengkap ada di struk PDF/invoice ${invoice || ''})\n`; }
  }
  return header + body + footer;
}
function openWA(msg){
  const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  try{ const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; document.body.appendChild(a); a.click(); a.remove(); }
  catch(e){ window.open(url, '_blank', 'noopener,noreferrer'); }
}
function formatHistoryDate(iso){ const d = new Date(iso); return d.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }) + ' · ' + d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }); }
function loadJSON(key, fallback){ try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch(e){ return fallback; } }
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }
async function postOrderToServer(payload){ const res = await fetch('/api/orders', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) }); if(!res.ok) throw new Error('HTTP ' + res.status); }
function groupsInCatalogFrom(catalog){ const present = new Set(catalog.map(g=>groupOf(g.cat))); return Array.from(present).sort((a,b)=>a.localeCompare(b,'id')); }
function catsInGroupFrom(catalog, g){ return catalog.map(x=>x.cat).filter(c=>groupOf(c)===g).sort((a,b)=>a.localeCompare(b,'id')); }

/* ================= Motion (motion.dev) untuk React ================= */
/* Dimuat dinamis (bukan static import) supaya kalau CDN gagal, seluruh app
   tetap jalan normal tanpa animasi — bukan error/blank page. */
function useMotionLib(){
  const [lib, setLib] = useState(null);
  useEffect(()=>{
    let alive = true;
    import("https://cdn.jsdelivr.net/npm/motion@11/react/+esm")
      .then(m => { if(alive) setLib(m); })
      .catch(()=>{ /* CDN gagal: lib tetap null, UI pakai fallback tanpa animasi */ });
    return ()=>{ alive = false; };
  }, []);
  return lib;
}

/* Elemen yang bisa dianimasikan Motion kalau lib berhasil dimuat, atau tampil
   biasa (tanpa animasi, tanpa error) kalau CDN gagal. Dipakai untuk toast &
   modal-card supaya keduanya konsisten pakai satu pola yang sama. */
function Animated({ motionLib, show, keyName, className, id, initial, animate, exit, transition, onClick, children }){
  if(motionLib){
    const { motion, AnimatePresence } = motionLib;
    return (
      <AnimatePresence>
        {show && (
          <motion.div key={keyName} className={className} id={id} onClick={onClick}
            initial={initial} animate={animate} exit={exit} transition={transition}>
            {children}
          </motion.div>
        )}
      </AnimatePresence>
    );
  }
  return show ? <div className={className} id={id} onClick={onClick}>{children}</div> : null;
}

/* ================= Komponen kecil ================= */
function Toast({ msg, visible, motionLib }){
  return (
    <Animated motionLib={motionLib} show={visible} keyName="toast" className="toast" id="toast"
      initial={{ opacity:0, x:'-50%', y:16 }}
      animate={{ opacity:1, x:'-50%', y:0 }}
      exit={{ opacity:0, x:'-50%', y:16, transition:{ duration:.16, ease:'easeIn' } }}
      transition={{ type:'spring', stiffness:420, damping:36, mass:.8 }}>
      <span id="toastMsg">{msg}</span>
    </Animated>
  );
}

function ProductModal({ state, onClose, onQtyChange, onAdd, onWish, currentUser, wishlist, motionLib, onGoogleLoginFromModal }){
  const open = !!state;
  const showPurchase = currentUser?.status === 'approved';
  let promptText = 'Masuk dulu untuk melihat harga dan memesan produk ini.';
  let promptBtnText = 'Lanjutkan dengan Google';
  if(currentUser){
    promptText = currentUser.status === 'pending' ? 'Akun kamu sedang diverifikasi admin.' : 'Lengkapi profil dulu supaya bisa lihat harga.';
    promptBtnText = currentUser.status === 'pending' ? 'Lihat Status' : 'Lengkapi Profil';
  }
  const wished = state ? !!wishlist[cartKey(state.cat, state.name, state.kemasan)] : false;
  return (
    <div className={"modal-overlay" + (open ? " open" : "")} id="productModal" onClick={(e)=>{ if(e.target.id === 'productModal') onClose(); }}>
      <Animated motionLib={motionLib} show={open} keyName="product-card" className="modal-card glass" id="productModalCard"
        initial={{ opacity:0, y:26, scale:.97 }}
        animate={{ opacity:1, y:0, scale:1 }}
        exit={{ opacity:0, y:16, scale:.97, transition:{ duration:.16, ease:'easeIn' } }}
        transition={{ type:'spring', stiffness:420, damping:36, mass:.8 }}>
        <button className="modal-close" aria-label="Tutup" onClick={onClose}><UiIcon name="close" /></button>
        <button className="modal-wish-btn" type="button" onClick={()=> state && onWish(state)}><UiIcon name="heart" filled={wished} /></button>
        {state && state.foto
          ? <img className="modal-photo" alt="" src={state.foto} style={{width:'100%', borderRadius:'16px'}} />
          : <div className="modal-photo-placeholder"><UiIcon name="package" size={26} /></div>}
        <p className="modal-cat">{state?.cat}</p>
        <h3>{state?.name}</h3>
        <p className="modal-kand">{state?.kand}</p>
        <div className="modal-meta" style={{display: showPurchase ? '' : 'none'}}>
          <div>
            <span className="kemasan-pill">{state?.kemasan}</span>
            <div className="modal-price">{fmt(state?.harga)}</div>
          </div>
          <div className="modal-qty">
            <button className="qty-btn" type="button" aria-label="Kurangi jumlah" onClick={()=> onQtyChange(-1)}><UiIcon name="minus" size={16} /></button>
            <span className="qty-val">{state?.qty ?? 1}</span>
            <button className="qty-btn" type="button" aria-label="Tambah jumlah" onClick={()=> onQtyChange(1)}><UiIcon name="plus" size={16} /></button>
          </div>
        </div>
        <button className="modal-add-btn checkout-btn" type="button" style={{display: showPurchase ? '' : 'none'}} onClick={onAdd}>Tambah ke Keranjang</button>
        <div className="modal-login-prompt" style={{display: showPurchase ? 'none' : 'block'}}>
          <p>{promptText}</p>
          <button className="google-btn" type="button" onClick={onGoogleLoginFromModal}>{promptBtnText}</button>
        </div>
      </Animated>
    </div>
  );
}

function LoginModal({ open, currentUser, onClose, motionLib, profileForm, setProfileForm, onProfileSubmit }){
  let step = 'google';
  let pendingTitle = '', pendingText = '';
  if(!currentUser){ step = 'google'; }
  else if(currentUser.status === 'incomplete'){ step = 'profile'; }
  else if(currentUser.status === 'pending'){ step = 'pending'; pendingTitle = 'Menunggu Persetujuan'; pendingText = 'Terima kasih! Data kamu sedang diverifikasi oleh tim kami.'; }
  else if(currentUser.status === 'rejected' || currentUser.status === 'blocked'){ step = 'pending'; pendingTitle = 'Akun Belum Bisa Diakses'; pendingText = 'Hubungi admin lewat WhatsApp untuk info lebih lanjut.'; }
  else { step = 'google'; }
  return (
    <div className={"modal-overlay" + (open ? " open" : "")} id="loginModal" onClick={(e)=>{ if(e.target.id === 'loginModal') onClose(); }}>
      <Animated motionLib={motionLib} show={open} keyName="login-card" className="modal-card glass" id="loginModalCard"
        initial={{ opacity:0, y:26, scale:.97 }}
        animate={{ opacity:1, y:0, scale:1 }}
        exit={{ opacity:0, y:16, scale:.97, transition:{ duration:.16, ease:'easeIn' } }}
        transition={{ type:'spring', stiffness:420, damping:36, mass:.8 }}>
        <button className="modal-close" onClick={onClose}>×</button>
        <p className="modal-cat">ail labs</p>
        {step === 'google' && (
          <div>
            <h3>Masuk untuk Melanjutkan</h3>
            <button className="google-btn" type="button" onClick={()=>{ window.location.href = '/api/customer/auth/google'; }}>Lanjutkan dengan Google</button>
          </div>
        )}
        {step === 'profile' && (
          <div>
            <h3>Lengkapi Profil</h3>
            {profileForm.error && <p className="profile-error" style={{color:'#B13A2C'}}>{profileForm.error}</p>}
            <div className="form-field"><label>Nama Klinik / Apotek / Praktik</label><input type="text" value={profileForm.clinic_name} onChange={(e)=> setProfileForm(f=>({...f, clinic_name:e.target.value}))} /></div>
            <div className="form-field"><label>Nomor WhatsApp Aktif</label><input type="tel" value={profileForm.phone} onChange={(e)=> setProfileForm(f=>({...f, phone:e.target.value}))} /></div>
            <button className="checkout-btn" type="button" onClick={onProfileSubmit}>Kirim untuk Diverifikasi</button>
          </div>
        )}
        {step === 'pending' && (
          <div>
            <h3>{pendingTitle}</h3>
            <p className="modal-kand">{pendingText}</p>
          </div>
        )}
      </Animated>
    </div>
  );
}

function ProfileModal({ open, currentUser, onClose, motionLib, form, setForm, onSave }){

        </div>
        <div className="receipt-actions" style={{display:'flex', gap:'10px', marginTop:'18px'}}>
          <button className="receipt-btn-secondary" id="receiptReprintBtn" type="button">Cetak Ulang</button>
          <button className="receipt-btn-primary checkout-btn" id="receiptSendBtn" type="button">Kirim Ulang ke WhatsApp</button>
        </div>
      </div>
    </div>
  );
}

/* ================= App utama ================= */
function App(){
  const [currentUser, setCurrentUser] = useState(null);
  const [catalog, setCatalog] = useState([]);
  const [activeGroup, setActiveGroup] = useState(null);
  const [activeCat, setActiveCat] = useState('Semua');
  const [catalogUnlocked, setCatalogUnlocked] = useState(false);
  const [catalogLoading, setCatalogLoading] = useState(true);
  const [catalogError, setCatalogError] = useState('');
  const [searchQuery, setSearchQuery] = useState('');
  const [searchOpen, setSearchOpen] = useState(false);
  const [cart, setCart] = useState(() => loadJSON(CART_STORAGE_KEY, {}));
  const [wishlist, setWishlist] = useState(() => loadJSON(WISHLIST_STORAGE_KEY, {}));
  const [history, setHistory] = useState(() => loadJSON(HISTORY_STORAGE_KEY, []));
  const [activeView, setActiveView] = useState('katalog');
  const [activeTab, setActiveTab] = useState('katalog');
  const [productModal, setProductModal] = useState(null);
  const [loginModalOpen, setLoginModalOpen] = useState(false);
  const [profileModalOpen, setProfileModalOpen] = useState(false);
  const [toast, setToast] = useState({ msg:'', visible:false });
  const [custName, setCustName] = useState('');
  const [custNote, setCustNote] = useState('');
  const [profileForm, setProfileForm] = useState({ clinic_name:'', phone:'', error:'' });
  const [profileEditForm, setProfileEditForm] = useState({ clinic_name:'', phone:'', error:'' });
  const [checkoutInProgress, setCheckoutInProgress] = useState(false);
  const [copyLabel, setCopyLabel] = useState('Salin');

  const toastTimerRef = useRef(null);
  const paypalContainerRef = useRef(null);
  const paypalStateRef = useRef({ loaded:false, loading:null, config:null });
  const motionLib = useMotionLib();

  /* --- persist ke localStorage, persis key lama --- */
  useEffect(()=>{ saveJSON(CART_STORAGE_KEY, cart); }, [cart]);
  useEffect(()=>{ saveJSON(WISHLIST_STORAGE_KEY, wishlist); }, [wishlist]);
  useEffect(()=>{ saveJSON(HISTORY_STORAGE_KEY, history); }, [history]);


  /* --- toast: animasi masuk/keluar ditangani deklaratif oleh <Animated>/AnimatePresence,
     jadi di sini cukup atur kapan toast tampil & kapan disembunyikan --- */
  function showToast(msg){
    clearTimeout(toastTimerRef.current);
    setToast({ msg, visible:true });
    toastTimerRef.current = setTimeout(()=> setToast(t=>({...t, visible:false})), 2000);
  }
  useEffect(()=> ()=> clearTimeout(toastTimerRef.current), []);

  /* --- modal open/close: AnimatePresence yang menangani animasi keluar sebelum
     card benar-benar dilepas dari DOM, jadi close cukup ubah state langsung --- */
  function openProductModal(cat, name, kand, kemasan, harga, foto){
    setProductModal({ cat, name, kand, kemasan, harga, foto, qty:1 });
  }
  function closeProductModal(){ setProductModal(null); }

  function openLoginModal(){ setLoginModalOpen(true); }
  function closeLoginModal(){ setLoginModalOpen(false); }

  function openProfileModal(){
    if(!currentUser) return;
    setProfileEditForm({ clinic_name: currentUser.clinic_name || '', phone: currentUser.phone || '', error:'' });
    setProfileModalOpen(true);
  }
  function closeProfileModal(){ setProfileModalOpen(false); }

  /* --- auth --- */
  async function checkAuthStatus(){
    try{ const res = await fetch('/api/customer/auth/me', { credentials:'include' }); setCurrentUser(res.ok ? await res.json() : null); }
    catch(err){ setCurrentUser(null); }
  }
  async function handleLogout(){
    try{ await fetch('/api/customer/auth/logout', { method:'POST', credentials:'include' }); } catch(err){}
    setCurrentUser(null); showToast('Berhasil keluar');
  }
  async function submitLoginProfile(){
    const clinic_name = profileForm.clinic_name.trim();
    const phone = profileForm.phone.trim();
    if(!clinic_name || !phone){ setProfileForm(f=>({...f, error:'Nama klinik/apotek dan nomor WhatsApp wajib diisi.'})); return; }
    try{
      const res = await fetch('/api/customer/auth/complete-profile', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ clinic_name, phone }) });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Gagal menyimpan profil');
      setCurrentUser(data); setProfileForm(f=>({...f, error:''})); showToast(`Selamat datang di AIL LABS, ${clinic_name}!`);
    } catch(err){ setProfileForm(f=>({...f, error: err.message || 'Terjadi kesalahan, coba lagi.'})); }
  }
  async function saveProfileEdit(){
    const clinic_name = profileEditForm.clinic_name.trim();
    const phone = profileEditForm.phone.trim();
    if(!clinic_name || !phone){ setProfileEditForm(f=>({...f, error:'Nama klinik/apotek dan nomor WhatsApp wajib diisi.'})); return; }
    try{
      const res = await fetch('/api/customer/auth/complete-profile', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ clinic_name, phone }) });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Gagal menyimpan perubahan');
      setCurrentUser(data); showToast('Profil berhasil diperbarui'); closeProfileModal();
    } catch(err){ setProfileEditForm(f=>({...f, error: err.message || 'Terjadi kesalahan, coba lagi.'})); }
  }
  function onGoogleLoginFromModal(){
    if(!currentUser){ window.location.href = '/api/customer/auth/google'; return; }
    closeProductModal(); openLoginModal();
  }

  /* --- katalog --- */
  async function loadCatalogFromAPI(){
    setCatalogLoading(true);
    setCatalogError('');
    try{
      const res = await fetch('/api/products', { credentials:'include', cache:'no-store' });
      const raw = await res.json().catch(()=>null);
      if(!res.ok) throw new Error((raw && raw.error) || 'Gagal memuat katalog (HTTP ' + res.status + ')');
      if(!Array.isArray(raw)) throw new Error('Format katalog tidak valid.');

      // API produksi mengembalikan grouped rows: [{cat,items:[...]}].
      // Normalizer ini juga menerima format flat object tanpa mengubah data lama.
      const normalized = raw.map((entry) => {
        if(entry && typeof entry === 'object' && Array.isArray(entry.items)){
          return {
            cat: String(entry.cat || 'Lainnya'),
            items: entry.items.filter(Array.isArray).map(item => [
              item[0] == null ? '' : String(item[0]),
              item[1] == null ? '' : String(item[1]),
              item[2] == null ? '' : String(item[2]),
              item[3] == null ? null : Number(item[3]),
              item[4] || null
            ]).filter(item => item[0])
          };
        }
        if(entry && typeof entry === 'object' && entry.name){
          return {
            cat: String(entry.cat || entry.category_name || 'Lainnya'),
            items: [[
              String(entry.name),
              String(entry.kandungan || ''),
              String(entry.kemasan || ''),
              entry.harga == null ? null : Number(entry.harga),
              entry.foto || entry.image_url || null
            ]]
          };
        }
        return null;
      }).filter(group => group && group.items.length);

      if(!normalized.length) throw new Error('Katalog kosong.');
      setCatalog(normalized);
      const nextGroups = groupsInCatalogFrom(normalized);
      setActiveGroup(current => current && nextGroups.includes(current) ? current : (nextGroups[0] || null));
      setActiveCat('Semua');
      setCatalogUnlocked(true);
    } catch(err){
      console.error('Catalog API error:', err);
      setCatalog([]);
      setCatalogUnlocked(false);
      setCatalogError(err.message || 'Katalog gagal dimuat.');
    } finally {
      setCatalogLoading(false);
    }
  }

  useEffect(()=>{ checkAuthStatus(); loadCatalogFromAPI(); retryPendingOrderSync(); }, []);

  const groups = groupsInCatalogFrom(catalog);
  const cats = activeGroup ? catsInGroupFrom(catalog, activeGroup) : [];

  function handleGroupClick(g){
    if(activeGroup === g) return;
    setActiveGroup(g); setActiveCat('Semua'); setCatalogUnlocked(false);
  }
  function handleCatClick(c){
    setActiveCat(c); setCatalogUnlocked(true);
    if(c !== 'Semua'){ setTimeout(()=>{ const el = document.getElementById('sec-'+slug(c)); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }, 50); }
  }

  /* --- wishlist --- */
  function toggleWishlistItem(cat, name, kemasan, harga){
    const key = cartKey(cat, name, kemasan);
    let active;
    setWishlist(w=>{
      const next = {...w};
      if(next[key]){ delete next[key]; active = false; } else { next[key] = { cat, name, kemasan, harga }; active = true; }
      return next;
    });
    return active;
  }
  function handleRowWish(cat, name, kemasan, harga){
    const willRemove = !!wishlist[cartKey(cat, name, kemasan)];
    toggleWishlistItem(cat, name, kemasan, harga);
    showToast(willRemove ? name + ' dihapus dari wishlist' : name + ' disimpan ke wishlist');
  }
  function handleModalWish(state){
    const willRemove = !!wishlist[cartKey(state.cat, state.name, state.kemasan)];
    toggleWishlistItem(state.cat, state.name, state.kemasan, state.harga);
    showToast(willRemove ? 'Dihapus dari wishlist' : 'Disimpan ke wishlist');
  }
  function moveWishlistToCart(key){
    const it = wishlist[key]; if(!it) return;
    addToCart(it.cat, it.name, it.kemasan, it.harga, 1);
    showToast(it.name + ' ditambahkan ke keranjang');
  }
  function removeWishlistItem(key){ setWishlist(w=>{ const next = {...w}; delete next[key]; return next; }); }

  /* --- cart --- */
  function addToCart(cat, name, kemasan, harga, qty){
    const key = cartKey(cat, name, kemasan);
    setCart(c=>{
      const next = {...c};
      if(next[key]){ next[key] = {...next[key], qty: next[key].qty + qty}; } else { next[key] = { name, kemasan, harga, qty }; }
      return next;
    });
  }
  function changeCartQty(key, delta){
    setCart(c=>{
      if(!c[key]) return c;
      const next = {...c};
      const newQty = next[key].qty + delta;
      if(newQty <= 0){ delete next[key]; } else { next[key] = {...next[key], qty:newQty}; }
      return next;
    });
  }
  function removeCartItem(key){ setCart(c=>{ const next = {...c}; delete next[key]; return next; }); }
  function clearCart(){ setCart({}); }
  const cartKeys = Object.keys(cart);
  const cartCount = Object.values(cart).reduce((s,i)=>s+i.qty, 0);
  const cartTotal = cartKeys.reduce((s,k)=> s + cart[k].harga * cart[k].qty, 0);

  /* --- checkout WA --- */
  async function retryPendingOrderSync(){
    const pending = loadJSON(PENDING_ORDERS_KEY, []);
    if(pending.length === 0) return;
    const stillFailed = [];
    for(const payload of pending){ try{ await postOrderToServer(payload); } catch(err){ stillFailed.push(payload); } }
    saveJSON(PENDING_ORDERS_KEY, stillFailed);
  }
  async function syncOrderToServer(payload){
    try{ await postOrderToServer(payload); }
    catch(err){ const pending = loadJSON(PENDING_ORDERS_KEY, []); pending.push(payload); saveJSON(PENDING_ORDERS_KEY, pending); }
  }
  function pushOrderHistory(items, total, name, note){
    setHistory(h=>{
      const next = [{ id: Date.now(), date: new Date().toISOString(), items, total, name, note }, ...h];
      return next.slice(0, 30);
    });
  }
  function checkoutWhatsApp(){
    if(cartKeys.length === 0) return;
    if(checkoutInProgress) return;
    const name = custName.trim();
    const note = custNote.trim();
    if(!name || name.length < 3){ showToast(name ? 'Nama terlalu pendek, minimal 3 karakter' : 'Mohon isi nama/klinik/apotek terlebih dahulu'); return; }
    setCheckoutInProgress(true);
    let total = 0;
    const orderItems = [];
    cartKeys.forEach(key=>{ const it = cart[key]; const cat = key.split('__')[0]; total += it.harga * it.qty; orderItems.push({ cat, name: it.name, kemasan: it.kemasan, harga: it.harga, qty: it.qty }); });
    const invoice = generateInvoiceNo();
    const msg = buildPOMessage(orderItems, total, name, note, invoice);
    openWA(msg);
    pushOrderHistory(orderItems, total, name, note);
    clearCart();
    closeProductModal();
    syncOrderToServer({ customer_name: name, note, items: orderItems, total, invoice });
    setCheckoutInProgress(false);
  }
  function copyBankAccount(){
    const done = ()=>{ setCopyLabel('Tersalin'); setTimeout(()=> setCopyLabel('Salin'), 1600); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(BANK_ACC_NO).then(done).catch(done); } else { done(); }
  }
  function confirmPaymentWhatsApp(){
    const msg = `==========================================\n    KONFIRMASI PEMBAYARAN — AIL LABS     \n==========================================\n\nHalo, saya sudah melakukan transfer ke rekening\nBCA a.n. Fudhail Aesthetic Labs, PT.\n\nBerikut saya lampirkan bukti pembayarannya.\nMohon dicek dan diproses pesanannya. Terima kasih! 🙏`;
    openWA(msg);
  }

  /* --- riwayat --- */
  function reorderHistory(id){
    const order = history.find(o=>o.id===id); if(!order) return;
    order.items.forEach(it=> addToCart(it.cat, it.name, it.kemasan, it.harga, it.qty));
    showToast('Item dari riwayat ditambahkan ke keranjang');
    switchView('cart', 'cart');
  }
  function resendHistoryWA(id){ const order = history.find(o=>o.id===id); if(!order) return; openWA(buildPOMessage(order.items, order.total, order.name, order.note)); }
  function clearHistory(){ if(history.length === 0) return; if(confirm('Hapus semua riwayat pesanan?')){ setHistory([]); } }

  /* --- navigasi tab/view --- */
  function switchView(viewId, tabId){
    setActiveView(viewId);
    if(tabId) setActiveTab(tabId);
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function handleTabClick(tabId){
    if(tabId === 'login'){ openLoginModal(); return; }
    switchView(tabId, tabId);
  }

  /* --- PayPal (lazy-load SDK, sama seperti sebelumnya) --- */
  async function loadPaypalSdk(){
    const st = paypalStateRef.current;
    if(st.loaded) return true;
    if(st.loading) return st.loading;
    st.loading = (async () => {
      try{
        if(!st.config){ const res = await fetch('/api/paypal/config'); if(!res.ok) return false; st.config = await res.json(); }
        await new Promise((resolve, reject) => {
          const existing = document.querySelector('script[data-paypal-sdk]');
          if(existing){ resolve(); return; }
          const script = document.createElement('script');
          script.setAttribute('data-paypal-sdk', 'true');
          script.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(st.config.clientId)}&currency=${encodeURIComponent(st.config.currency || 'USD')}`;
          script.onload = resolve; script.onerror = reject;
          document.head.appendChild(script);
        });
        st.loaded = true; return true;
      } catch(err){ console.error('Gagal memuat PayPal SDK:', err); return false; }
      finally { st.loading = null; }
    })();
    return st.loading;
  }
  function buildPaypalItems(){ return cartKeys.map(key=>{ const it = cart[key]; const cat = key.split('__')[0]; return { cat, name: it.name, qty: it.qty }; }); }
  async function renderPaypalButtons(){
    const container = paypalContainerRef.current;
    if(!container) return;
    container.innerHTML = '<p style="font-size:12px;color:var(--ink-400);text-align:center;">Memuat PayPal…</p>';
    const ok = await loadPaypalSdk();
    if(!ok || !window.paypal){ container.innerHTML = '<p style="font-size:12px;color:var(--ink-400);text-align:center;">PayPal sedang tidak tersedia. Gunakan checkout WhatsApp di atas.</p>'; return; }
    container.innerHTML = '';
    window.paypal.Buttons({
      style: { layout: 'vertical', color: 'gold', shape: 'rect', label: 'paypal' },
      createOrder: async () => {
        const items = buildPaypalItems();
        if(items.length === 0) throw new Error('Keranjang kosong.');
        const res = await fetch('/api/paypal/create-order', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ items }) });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Gagal membuat order PayPal.');
        return data.id;
      },
      onApprove: async (data) => {
        const name = custName.trim(); const note = custNote.trim();
        const items = buildPaypalItems();
        try{
          const res = await fetch(`/api/paypal/capture-order/${data.orderID}`, { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ customer_name: name, note, items }) });
          const order = await res.json();
          if(!res.ok){ showToast(order.error || 'Pembayaran gagal diproses.'); return; }
          clearCart(); closeProductModal();
          showToast('Pembayaran PayPal berhasil! Pesanan sedang diproses.');
        } catch(err){ console.error(err); showToast('Pembayaran diterima PayPal, tapi gagal tersinkron ke server. Hubungi admin via WhatsApp.'); }
      },
      onCancel: () => { showToast('Pembayaran PayPal dibatalkan.'); },
      onError: (err) => { console.error('PayPal error:', err); showToast('Terjadi kendala pada PayPal. Coba lagi atau gunakan checkout WhatsApp.'); }
    }).render(container);
  }
  useEffect(()=>{
    if(activeView === 'cart' && currentUser && currentUser.status === 'approved' && cartKeys.length > 0){ renderPaypalButtons(); }
  }, [activeView, currentUser && currentUser.status, cartKeys.length]);

  const isApproved = currentUser?.status === 'approved';
  const q = searchQuery.trim().toLowerCase();

  return (
    <React.Fragment>
      <Toast msg={toast.msg} visible={toast.visible} motionLib={motionLib} />

      <ProductModal
        state={productModal}
        onClose={closeProductModal}
        onQtyChange={(delta)=> setProductModal(s=> s ? {...s, qty: Math.max(1, s.qty + delta)} : s)}
        onAdd={()=>{ if(!productModal) return; addToCart(productModal.cat, productModal.name, productModal.kemasan, productModal.harga, productModal.qty); showToast('Ditambahkan ke keranjang'); closeProductModal(); }}
        onWish={handleModalWish}
        currentUser={currentUser}
        wishlist={wishlist}
        motionLib={motionLib}
        onGoogleLoginFromModal={onGoogleLoginFromModal}
      />
      <LoginModal
        open={loginModalOpen}
        currentUser={currentUser}
        onClose={closeLoginModal}
        motionLib={motionLib}
        profileForm={profileForm}
        setProfileForm={setProfileForm}
        onProfileSubmit={submitLoginProfile}
      />
      <ProfileModal
        open={profileModalOpen}
        currentUser={currentUser}
        onClose={closeProfileModal}
        motionLib={motionLib}
        form={profileEditForm}
        setForm={setProfileEditForm}
        onSave={saveProfileEdit}
      />
      <ReceiptModalUnused />

      <header className="topbar" style={{position:'sticky', top:0, zIndex:40, padding:'14px 16px 10px'}}>
        <div className="topbar-row" style={{display:'flex', alignItems:'center', gap:'12px'}}>
          <div className="topbar-inner glass" style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:'14px', borderRadius:'999px', padding:'7px 8px', flex:1}}>
            <div className="brand"><span className="brand-mark" style={{width:'34px', height:'34px', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--green-900)'}}><img src="/images/logo-badge-silver.png" alt="ail labs" style={{width:'78%', height:'78%', objectFit:'contain'}} /></span></div>
            <div className="topbar-actions" style={{display:'flex', gap:'6px'}}>
              <button className="icon-btn" aria-label="Wishlist" style={{width:'38px', height:'38px', borderRadius:'50%', border:'1px solid #E4E8E8', background:'#fff', position:'relative', display: isApproved ? '' : 'none'}} onClick={()=> switchView('wishlist', null)}>
                <UiIcon name="heart" size={19} />{Object.keys(wishlist).length > 0 && <span className="icon-badge" style={{position:'absolute', top:'-2px', right:'-2px', minWidth:'16px', height:'16px', borderRadius:'999px', background:'var(--emerald-600)', color:'#fff', fontSize:'9.5px', textAlign:'center'}}>{Object.keys(wishlist).length}</span>}
              </button>
              <button className="icon-btn" aria-label="Cari" style={{width:'38px', height:'38px', borderRadius:'50%', border:'1px solid #E4E8E8', background:'#fff'}} onClick={()=> setSearchOpen(o=>!o)}><UiIcon name="search" /></button>
              {isApproved && <button className="icon-btn" aria-label="Profil Saya" style={{width:'38px', height:'38px', borderRadius:'50%', border:'1px solid #E4E8E8', background:'#fff'}} onClick={openProfileModal}><UiIcon name="user" /></button>}
              {currentUser && <button className="icon-btn" aria-label="Keluar" style={{width:'38px', height:'38px', borderRadius:'50%', border:'1px solid #E4E8E8', background:'#fff'}} onClick={handleLogout}><UiIcon name="logout" /></button>}
            </div>
          </div>
          <div className="chip-scroller glass" style={{display:'flex', gap:'3px', overflowX:'auto', padding:'5px', borderRadius:'999px'}}>
            {groups.map(g=> <button key={g} className={"chip" + (g===activeGroup ? " active" : "")} style={{flex:'none', whiteSpace:'nowrap', border:'none', background:'transparent', cursor:'pointer', fontSize:'13px', fontWeight:600, padding:'7.5px 14px', borderRadius:'999px'}} onClick={()=> handleGroupClick(g)}>{g}</button>)}
          </div>
        </div>
        <div className="chip-scroller glass" style={{display:'flex', gap:'3px', overflowX:'auto', padding:'5px', borderRadius:'999px', marginTop:'8px'}}>
          {cats.map(c=> <button key={c} className={"chip" + (c===activeCat ? " active" : "")} style={{flex:'none', whiteSpace:'nowrap', border:'none', background:'transparent', cursor:'pointer', fontSize:'13px', fontWeight:600, padding:'7.5px 14px', borderRadius:'999px'}} onClick={()=> handleCatClick(c)}>{c}</button>)}
        </div>
        <div className="search-wrap" style={{maxHeight: searchOpen ? '64px' : '0', overflow:'hidden'}}>
          <div className="search-bar glass" style={{display:'flex', gap:'8px', borderRadius:'18px', padding:'11px 14px', marginTop:'10px'}}>
            <input type="text" placeholder="Cari nama produk atau kandungan…" style={{border:'none', outline:'none', background:'transparent', fontSize:'15px', width:'100%'}} value={searchQuery} onChange={(e)=> setSearchQuery(e.target.value)} />
          </div>
        </div>
      </header>

      <main className={"view" + (activeView==='katalog' ? " active" : "")} id="view-katalog">
        <div className="hero-card">
          <div className="hero-body">
            <div className="hero-brandline">
              <span className="hero-kicker">AIL LABS</span>
              <span className="hero-rule" aria-hidden="true"></span>
              <span className="hero-kicker-muted">B2B AESTHETIC SUPPLY</span>
            </div>
            <h1>B2B Aesthetic Distributor Partner &amp; Private Label Manufacturing</h1>
            <p className="hero-sub">Solusi pasokan estetika profesional untuk klinik, rumah sakit, distributor, dan partner private label.</p>
            <div className="hero-actions">
              <button className="primary" type="button" onClick={()=>document.getElementById('productGroups')?.scrollIntoView({behavior:'smooth'})}>Explore catalog</button>
              <button className="secondary" type="button" onClick={()=>isApproved?switchView('cart','cart'):openLoginModal()}>Request quotation</button>
            </div>
          </div>
        </div>

        {currentUser?.status === 'pending' && (
          <div className="pending-banner" style={{display:'flex'}}>
            <span>Akun kamu sedang diverifikasi admin. Harga &amp; checkout akan terbuka otomatis setelah disetujui.</span>
          </div>
        )}

        <div className="section-head glass" style={{marginBottom:'18px'}}>
          <div><h2>Katalog Produk</h2><span className="section-count">Produk terpilih · AIL LABS</span></div>
        </div>
        <div id="productGroups">
          {catalogLoading && <div className="empty-state" role="status" aria-live="polite" style={{textAlign:'center', padding:'38px 20px', color:'var(--mm-muted)'}}>Memuat katalog produk…</div>}
          {!catalogLoading && catalogError && <div className="empty-state" role="alert" style={{textAlign:'center', padding:'38px 20px', color:'var(--mm-muted)'}}>
            <strong style={{display:'block', color:'var(--mm-text)', marginBottom:'6px'}}>Katalog belum dapat dimuat</strong>
            <span style={{display:'block', marginBottom:'14px'}}>{catalogError}</span>
            <button type="button" onClick={loadCatalogFromAPI} style={{minHeight:'44px', border:'1px solid var(--mm-teal)', borderRadius:'999px', padding:'9px 16px', background:'#fff', color:'var(--mm-teal)', fontWeight:700, cursor:'pointer'}}>Coba lagi</button>
          </div>}
          {!catalogLoading && !catalogError && !catalogUnlocked && catalog.length===0 && <div className="empty-state" style={{textAlign:'center', padding:'38px 20px', color:'var(--mm-muted)'}}>Belum ada produk aktif di katalog.</div>}
          {!catalogLoading && !catalogError && catalogUnlocked && (()=>{
            let totalMatches = 0;
            const blocks = catalog.map((group, gi)=>{
              if(activeGroup && groupOf(group.cat)!==activeGroup) return null;
              if(activeCat!=="Semua" && activeCat!==group.cat) return null;
              const catMatches = q && group.cat.toLowerCase().includes(q);
              const items = group.items.map((item, ii) => ({item, ii})).filter(({item:[name,kand]}) => !q || catMatches || name.toLowerCase().includes(q) || kand.toLowerCase().includes(q));
              if(items.length===0) return null;
              totalMatches += items.length;
              return (
                <div className="section-block" id={"sec-"+slug(group.cat)} key={group.cat}>
                  <div className="section-head glass"><h2 style={{fontFamily:'var(--font-display)', fontSize:'20px', margin:0}}>{group.cat}</h2><span className="section-count">{items.length} produk</span></div>
                  <div className="group glass">
                    {items.map(({item:[name,kand,kemasan,harga,foto], ii})=>{
                      const wished = !!wishlist[cartKey(group.cat,name,kemasan)];
                      return (
                        <div className="row" key={ii} onClick={()=> openProductModal(group.cat, name, kand, kemasan, harga, foto)}>
                          {foto ? (
                            <React.Fragment>
                              <img className="row-thumb" src={foto} alt={name} loading="lazy"
                                onError={(e)=>{ e.currentTarget.style.display='none'; const placeholder=e.currentTarget.nextElementSibling; if(placeholder) placeholder.removeAttribute('hidden'); }} />
                              <div className="row-thumb row-thumb-placeholder" hidden style={{display:'flex', alignItems:'center', justifyContent:'center', color:'#9CA3AF'}} aria-hidden="true">
                                <UiIcon name="package" size={22} />
                              </div>
                            </React.Fragment>
                          ) : (
                            <div className="row-thumb row-thumb-placeholder" style={{display:'flex', alignItems:'center', justifyContent:'center', color:'#9CA3AF'}} aria-hidden="true">
                              <UiIcon name="package" size={22} />
                            </div>
                          )}
                          <div className="row-body" style={{flex:1, minWidth:0}}>
                            <p className="row-name">{name}</p>
                            <p className="row-sub" style={{fontSize:'12px', color:'var(--ink-600)', margin:0}}>{kand}</p>
                            <div className="row-bottom" style={{display:'flex', justifyContent:'space-between', marginTop:'2px'}}>
                              <p className="row-kemasan" style={{fontSize:'11.5px', color:'var(--ink-400)', margin:0}}>{kemasan}</p>
                              {currentUser ? <div className="row-price">{fmt(harga)}</div> : <div className="row-price row-price-locked">Masuk</div>}
                            </div>
                          </div>
                          {currentUser && <button className="wish-btn" type="button" style={{border:'none', background:'none', cursor:'pointer'}} onClick={(e)=>{ e.stopPropagation(); handleRowWish(group.cat, name, kemasan, harga); }}><UiIcon name="heart" size={19} filled={wished} /></button>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            });
            if(totalMatches===0) return <div className="empty-state" role="status" style={{textAlign:'center', padding:'38px 20px', color:'var(--mm-muted)'}}>Belum ada produk di kategori ini</div>;
            return blocks;
          })()}
        </div>
      </main>

      <main className={"view" + (activeView==='info' ? " active" : "")} id="view-info">
        <div className="info-card glass" style={{padding:'18px', marginBottom:'14px'}}>
          <h2>Prosedur Pembayaran</h2>
          <p className="sub">Transfer ke rekening resmi perusahaan</p>
          <div className="bank-card glass">
            <div className="bank-logo" style={{width:'44px', height:'44px', borderRadius:'12px', background:'#0F6FBF', color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:800, fontSize:'11.5px'}}>BCA</div>
            <div className="bank-detail">
              <p className="bank-acc-no" style={{fontSize:'16px', fontWeight:700, margin:0}}>{BANK_ACC_NO}</p>
              <p className="bank-acc-name" style={{fontSize:'12px', color:'var(--ink-600)', margin:'2px 0 0'}}>a.n. Fudhail Aesthetic Labs, PT</p>
            </div>
            <button className="copy-btn" type="button" style={{border:'none', borderRadius:'999px', padding:'8px 14px', fontSize:'12px', fontWeight:700, background:'#fff', cursor:'pointer'}} onClick={copyBankAccount}>{copyLabel}</button>
          </div>
          <button className="checkout-btn" type="button" style={{marginTop:'12px'}} onClick={confirmPaymentWhatsApp}>Konfirmasi Pembayaran via WhatsApp</button>
        </div>
        <div className="contact-card glass" style={{padding:'18px', color:'#fff', background:'var(--green-900)', borderRadius:'var(--radius-lg)'}}>
          <h2>PT Fudhail Aesthetic Laboratories</h2>
          <div className="contact-links" style={{display:'flex', flexDirection:'column', gap:'8px'}}>
            <a className="contact-link" href="mailto:FALABS@icloud.com" style={{color:'#fff', textDecoration:'none'}}>Email: FALABS@icloud.com</a>
          </div>
        </div>
      </main>

      <main className={"view" + (activeView==='cart' ? " active" : "")} id="view-cart">
        <div className="hero-card" style={{margin:'34px 0 18px', padding:'22px'}}>
          <div className="hero-body">
            <p className="eyebrow" style={{color:'var(--silver-400)', fontSize:'11px', textTransform:'uppercase'}}>Pesanan B2B</p>
            <h1 style={{fontSize:'23px', color:'#fff', fontFamily:'var(--font-display)'}}>Keranjang &amp; Invoice</h1>
            <p className="hero-sub" style={{color:'rgba(255,255,255,.78)', margin:0}}>Pilih produk dan kirim permintaan pesanan langsung ke WhatsApp kami</p>
          </div>
        </div>
        <div id="cartContent">
          {cartKeys.length === 0 ? (
            <div className="cart-empty" style={{textAlign:'center', padding:'60px 20px'}}>Keranjang masih kosong.</div>
          ) : (
            <React.Fragment>
              <div className="group glass">
                {cartKeys.map(key=>{
                  const it = cart[key];
                  return (
                    <div className="cart-row" key={key}>
                      <div className="cart-row-main"><p className="cart-row-name">{it.name}</p><p className="cart-row-price">{it.kemasan} · {fmt(it.harga)}</p></div>
                      <div className="cart-row-trail">
                        <div className="cart-qty"><button className="qty-btn" type="button" aria-label="Kurangi jumlah" onClick={()=> changeCartQty(key,-1)}><UiIcon name="minus" size={16} /></button><span className="qty-val">{it.qty}</span><button className="qty-btn" type="button" aria-label="Tambah jumlah" onClick={()=> changeCartQty(key,1)}><UiIcon name="plus" size={16} /></button></div>
                        <div className="cart-subtotal">{fmt(it.harga * it.qty)}</div>
                        <button className="cart-remove" type="button" onClick={()=> removeCartItem(key)}>Hapus</button>
                      </div>
                    </div>
                  );
                })}
              </div>
              <div className="cart-summary glass" style={{padding:'16px 18px', borderRadius:'var(--radius-lg)', margin:'14px 0'}}>
                <div className="cart-summary-row total" style={{display:'flex', justifyContent:'space-between', fontSize:'17px', fontWeight:700}}><span>Total</span><span className="val">{fmt(cartTotal)}</span></div>
              </div>
              <div className="info-card glass" style={{padding:'18px', marginBottom:'14px'}}>
                <h2>Data Pemesan</h2>
                <div className="form-field"><label>Nama / Klinik / Apotek</label><input type="text" placeholder="cth. Klinik Sehat Bersama" value={custName} onChange={(e)=> setCustName(e.target.value)} /></div>
                <div className="form-field"><label>Catatan (opsional)</label><textarea maxLength={240} value={custNote} onChange={(e)=> setCustNote(e.target.value)}></textarea></div>
              </div>
              <div className="info-card glass" style={{padding:'18px', marginBottom:'14px'}}>
                <h2>Prosedur Pembayaran</h2>
                <div className="bank-card glass">
                  <div className="bank-logo" style={{width:'44px', height:'44px', borderRadius:'12px', background:'#0F6FBF', color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:800, fontSize:'11.5px'}}>BCA</div>
                  <div className="bank-detail"><p className="bank-acc-no" style={{fontSize:'16px', fontWeight:700, margin:0}}>{BANK_ACC_NO}</p><p className="bank-acc-name" style={{fontSize:'12px', margin:'2px 0 0'}}>a.n. Fudhail Aesthetic Labs, PT</p></div>
                  <button className="copy-btn" type="button" style={{border:'none', borderRadius:'999px', padding:'8px 14px', fontSize:'12px', fontWeight:700, background:'#fff', cursor:'pointer'}} onClick={copyBankAccount}>{copyLabel}</button>
                </div>
              </div>
              <button className="checkout-btn" type="button" disabled={checkoutInProgress} onClick={checkoutWhatsApp}>Kirim Pesanan via WhatsApp</button>
              {isApproved && (
                <React.Fragment>
                  <div className="paypal-divider" style={{textAlign:'center', margin:'14px 0 8px', color:'var(--ink-400)', fontSize:'12px', textTransform:'uppercase'}}>atau bayar dengan PayPal (USD)</div>
                  <div id="paypal-button-container" ref={paypalContainerRef}></div>
                </React.Fragment>
              )}
            </React.Fragment>
          )}
        </div>
      </main>

      <main className={"view" + (activeView==='wishlist' ? " active" : "")} id="view-wishlist">
        <div className="section-head glass" style={{paddingTop:'20px'}}>
          <button className="back-chip" type="button" onClick={()=> switchView('katalog','katalog')}><UiIcon name="back" size={16} /> Kembali</button>
          <span className="section-count">{Object.keys(wishlist).length} produk</span>
        </div>
        <h1 className="view-title">Wishlist Saya</h1>
        <div id="wishlistContent">
          {Object.keys(wishlist).length === 0 ? (
            <div className="cart-empty" style={{textAlign:'center', padding:'60px 20px'}}>Belum ada produk favorit.</div>
          ) : (
            <div className="group glass">
              {Object.keys(wishlist).map(key=>{
                const it = wishlist[key];
                return (
                  <div className="cart-row" key={key}>
                    <div className="cart-row-main"><p className="cart-row-name">{it.name}</p><p className="cart-row-price">{it.kemasan} · {fmt(it.harga)}</p></div>
                    <div className="cart-row-trail">
                      <button className="wish-add-btn" type="button" onClick={()=> moveWishlistToCart(key)}>+ Keranjang</button>
                      <button className="cart-remove" type="button" onClick={()=> removeWishlistItem(key)}>Hapus</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </main>

      <main className={"view" + (activeView==='riwayat' ? " active" : "")} id="view-riwayat">
        <div className="section-head glass" style={{paddingTop:'20px'}}>
          <button className="back-chip" type="button" onClick={()=> switchView('cart','cart')}><UiIcon name="back" size={16} /> Kembali</button>
          <button className="clear-history-btn" type="button" onClick={clearHistory}>Hapus Semua</button>
        </div>
        <h1 className="view-title">Riwayat Pesanan</h1>
        <div id="historyContent">
          {history.length === 0 ? (
            <div className="cart-empty" style={{textAlign:'center', padding:'60px 20px'}}>Belum ada riwayat pesanan.</div>
          ) : history.map(order=>{
            const totalQty = order.items.reduce((s,i)=>s+i.qty, 0);
            return (
              <div className="info-card glass order-card" style={{marginBottom:'12px', padding:'18px'}} key={order.id}>
                <div className="order-meta" style={{display:'flex', justifyContent:'space-between', fontSize:'11px', color:'var(--ink-400)'}}><span>{formatHistoryDate(order.date)}</span><span>{totalQty} item</span></div>
                <p className="order-items" style={{fontSize:'12.5px'}}>{order.items.map((it,i)=> <React.Fragment key={i}>{it.qty}× {it.name} ({it.kemasan})<br/></React.Fragment>)}</p>
                <div className="order-total" style={{display:'flex', justifyContent:'space-between', fontWeight:700}}><span>Total</span><span>{fmt(order.total)}</span></div>
                <div className="order-actions" style={{display:'flex', gap:'8px', marginTop:'10px'}}>
                  <button className="btn-reorder" type="button" style={{flex:1, border:'none', borderRadius:'999px', padding:'11px', background:'var(--green-700)', color:'#fff', cursor:'pointer'}} onClick={()=> reorderHistory(order.id)}>Pesan Lagi</button>
                  <button className="btn-wa" type="button" style={{flex:1, border:'none', borderRadius:'999px', padding:'11px', background:'rgba(116,173,180,.14)', cursor:'pointer'}} onClick={()=> resendHistoryWA(order.id)}>Kirim Ulang</button>
                </div>
              </div>
            );
          })}
        </div>
      </main>

      <nav className="tabbar glass" id="tabbar">
        <button className={"tab" + (activeTab==='katalog' ? " active" : "")} onClick={()=> handleTabClick('katalog')}><UiIcon name="grid" size={22} /><br/>Katalog</button>
        {isApproved && <button className={"tab" + (activeTab==='cart' ? " active" : "")} onClick={()=> handleTabClick('cart')}>{cartCount > 0 && <span className="tab-badge">{cartCount}</span>}<UiIcon name="cart" size={22} /><br/>Keranjang</button>}
        {!isApproved && <button className={"tab" + (activeTab==='login' ? " active" : "")} onClick={()=> handleTabClick('login')}><UiIcon name="user" size={22} /><br/>Masuk</button>}
        {isApproved && <button className={"tab" + (activeTab==='riwayat' ? " active" : "")} onClick={()=> handleTabClick('riwayat')}><UiIcon name="clock" size={22} /><br/>Riwayat</button>}
        <button className={"tab" + (activeTab==='info' ? " active" : "")} onClick={()=> handleTabClick('info')}><UiIcon name="info" size={22} /><br/>Disclaimer</button>
      </nav>
    </React.Fragment>
  );
}

createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
(function(){
  try{
    var reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var blocks=document.querySelectorAll('.section-block');
    if(reduced || !('IntersectionObserver' in window)){blocks.forEach(function(el){el.classList.add('is-visible')});return;}
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){if(entry.isIntersecting){entry.target.classList.add('is-visible');io.unobserve(entry.target);}});
    },{rootMargin:'0px 0px -8% 0px',threshold:.04});
    blocks.forEach(function(el){io.observe(el)});
  }catch(e){}
})();
</script>
<script src="/visitor-tracker.js"></script>

</body>
</html>

sition:transform .22s cubic-bezier(.22,1,.36,1)!important;}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}.row,.hero-actions button,.tab,.chip,.modal-overlay,.modal-card{transition:none!important}.row:hover,.hero-actions button:hover{transform:none!important}}\n</style>\n
