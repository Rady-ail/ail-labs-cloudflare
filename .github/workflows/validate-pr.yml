name: Validate Pull Request

on:
  push:
    branches:
      - fix/visitor-permissions-handler-2026-11-08
      - repair/visitor-permission-storage-and-ci-2026-11-08
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and static integrity audit
        run: npm run build

      - name: Unit tests (catalog agent + Claude guard hooks)
        run: npm test

      - name: Check visitor route syntax
        run: node --check routes/visitors.js

      - name: Ensure visitor permissions route is registered once
        run: |
          node -e '
            const fs = require("node:fs");
            const source = fs.readFileSync("routes/visitors.js", "utf8");
            const route = "router.post(" + String.fromCharCode(39) + "/permissions" + String.fromCharCode(39);
            const count = source.split(route).length - 1;
            if (count !== 1) {
              console.error("Expected exactly one POST /permissions route; found " + count);
              process.exit(1);
            }
            console.log("PASS: exactly one POST /permissions route");
          '

      - name: Validate permission INSERT parameter mapping
        run: |
          node -e '
            const fs = require("node:fs");
            const source = fs.readFileSync("routes/visitors.js", "utf8");
            const start = source.indexOf("INSERT INTO visitor_permissions");
            const end = source.indexOf("RETURNING id, session_id", start);
            const sql = source.slice(start, end);
            const q = String.fromCharCode(39);
            const checks = [
              ["latitude must be gated and use $5", "CASE WHEN $3 = " + q + "granted" + q + " AND $4::boolean THEN $5 ELSE NULL END"],
              ["longitude must be gated and use $6", "CASE WHEN $3 = " + q + "granted" + q + " AND $4::boolean THEN $6 ELSE NULL END"],
              ["accuracy must be gated and use $7", "CASE WHEN $3 = " + q + "granted" + q + " AND $4::boolean THEN $7 ELSE NULL END"],
              ["page must use $8", "$8,\n"],
              ["conflict update must preserve $8 page", "page = COALESCE($8, visitor_permissions.page)"]
            ];
            for (const [label, expected] of checks) {
              if (!sql.includes(expected)) { console.error("FAIL: " + label); process.exit(1); }
            }
            console.log("PASS: visitor permission INSERT parameter mapping");
          '
