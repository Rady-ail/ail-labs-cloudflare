name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          command: deploy
          secrets: |
            DATABASE_URL
            SESSION_SECRET
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Verify deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          if [[ -z "$DEPLOYMENT_URL" ]]; then
            echo 'FAIL deployment-url output is empty'
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            echo "Verification attempt ${attempt}/5: ${DEPLOYMENT_URL}"
            set +e
            output=$(scripts/verify-deploy.sh "$DEPLOYMENT_URL" 2>&1)
            verify_status=$?
            set -e
            printf '%s\n' "$output"

            if [[ $verify_status -eq 0 ]]; then
              exit 0
            fi

            if [[ $attempt -lt 5 ]] && grep -Eq ' (000|404)([[:space:]]|$)' <<< "$output"; then
              echo 'Deployment is not ready yet; retrying in 5 seconds.'
              sleep 5
              continue
            fi

            exit "$verify_status"
          done
