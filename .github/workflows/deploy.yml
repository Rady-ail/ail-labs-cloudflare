name: Deploy to Cloudflare Workers
# OAuth runtime secrets are injected from GitHub Actions Secrets.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Static integrity audit\n        run: npm run build\n\n      - name: Wrangler dry-run\n        run: npx wrangler@4.86.0 deploy --dry-run\n\n      - name: Check custom domain zone
        id: zone
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            'https://api.cloudflare.com/client/v4/zones?name=ail-aesthetic-labs.my.id' \
            | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                try {
                  const response = JSON.parse(input);
                  const zone = Array.isArray(response.result)
                    ? response.result.find(item => item.account?.id === process.env.CLOUDFLARE_ACCOUNT_ID)
                    : undefined;
                  console.log(`success=${response.success === true}`);
                  console.log(`zone_status=${zone?.status || "not-found-in-account"}`);
                  console.log(`account_name=${zone?.account?.name || "not-found-in-account"}`);
                  if (response.success !== true || !zone || zone.status !== "active") process.exitCode = 1;
                } catch {
                  console.log("success=false");
                  console.log("zone_status=unreadable-response");
                  console.log("account_name=unavailable");
                  process.exitCode = 1;
                }
              });
            '

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.86.0'
          command: deploy

      - name: Diagnose Cloudflare account on deploy failure
        if: failure() && (steps.deploy.outcome == 'failure' || steps.deploy_final.outcome == 'failure')
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          account_id_length=${#CLOUDFLARE_ACCOUNT_ID}
          if [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            account_id_format=true
          else
            account_id_format=false
          fi
          printf 'CLOUDFLARE_ACCOUNT_ID length: %s\n' "$account_id_length"
          printf 'CLOUDFLARE_ACCOUNT_ID format valid: %s\n' "$account_id_format"
          printf 'CLOUDFLARE_API_TOKEN length: %s\n' "${#CLOUDFLARE_API_TOKEN}"

          echo 'Cloudflare account names accessible to this token:'
          if ! curl --silent --show-error --fail \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/accounts \
            | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                try {
                  const response = JSON.parse(input);
                  if (!response.success || !Array.isArray(response.result)) throw new Error();
                  for (const account of response.result) {
                    if (typeof account.name === "string") console.log(account.name);
                  }
                } catch {
                  console.error("Could not read account names from Cloudflare API.");
                  process.exitCode = 1;
                }
              });
            '; then
            echo 'Could not retrieve Cloudflare account names.'
          fi

      - name: Set runtime secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          node -e '
            const secrets = {
              DATABASE_URL: process.env.DATABASE_URL,
              SESSION_SECRET: process.env.SESSION_SECRET,
            };
            const googleId = process.env.GOOGLE_CLIENT_ID;
            const googleSecret = process.env.GOOGLE_CLIENT_SECRET;
            if (!secrets.DATABASE_URL || !secrets.SESSION_SECRET) {
              console.error("A required runtime secret is missing.");
              process.exit(1);
            }
            if (Boolean(googleId) !== Boolean(googleSecret)) {
              console.error("GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET must be configured together.");
              process.exit(1);
            }
            if (googleId && googleSecret) {
              secrets.GOOGLE_CLIENT_ID = googleId;
              secrets.GOOGLE_CLIENT_SECRET = googleSecret;
            } else {
              console.log("Google customer login secrets are not configured yet; deployment will keep the existing runtime state.");
            }
            process.stdout.write(JSON.stringify(secrets));
          ' | npx wrangler secret bulk

      - name: Deploy Worker with runtime secrets
        id: deploy_final
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.86.0'
          command: deploy

      - name: Verify deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy_final.outputs.deployment-url }}
        shell: bash
        run: |
          if [[ -z "$DEPLOYMENT_URL" ]]; then
            echo 'FAIL deployment-url output is empty'
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            echo "Verification attempt ${attempt}/5: ${DEPLOYMENT_URL}"
            set +e
            output=$(scripts/verify-deploy.sh "$DEPLOYMENT_URL" 2>&1)
            verify_status=$?
            set -e
            printf '%s\n' "$output"

            if [[ $verify_status -eq 0 ]]; then
              exit 0
            fi

            if [[ $attempt -lt 5 ]] && grep -Eq ' (000|404)([[:space:]]|$)' <<< "$output"; then
              echo 'Deployment is not ready yet; retrying in 5 seconds.'
              sleep 5
              continue
            fi

            exit "$verify_status"
          done
