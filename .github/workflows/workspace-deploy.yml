name: Deploy Workspace to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "workspace/**"
      - ".github/workflows/workspace-deploy.yml"
  workflow_dispatch:

concurrency:
  group: workspace-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: workspace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: workspace/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Backend typecheck
        run: npm run typecheck

      - name: Frontend typecheck
        run: npm run typecheck:ui

      - name: Unit and integration tests
        run: npm test

      - name: Build original workspace UI
        run: npm run build:ui

      - name: Deploy workspace Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.86.0 deploy --config wrangler.jsonc

      - name: Verify deployed workspace
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          site="https://app.ail-aesthetic-labs.my.id"
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          fetch() { curl --silent --show-error --location --retry 3 --retry-delay 5 -A "$ua" -D /tmp/headers.txt -o "$2" -w '%{http_code}' "$1"; }
          code="$(fetch "$site/" /tmp/index.html)" || code=000
          if [ "$code" = "403" ]; then
            # Edge Cloudflare memblokir runner CI (bukan kegagalan aplikasi). Bukti cadangan: daftar deployment via API terautentikasi.
            echo "::warning::HTTP 403 dari edge untuk runner CI ($(grep -i '^cf-mitigated' /tmp/headers.txt || echo 'tanpa header cf-mitigated')). Verifikasi publik dilewati; memeriksa deployment lewat API."
            set -e
            npx wrangler@4.86.0 deployments list --config wrangler.jsonc | tail -n 15
            exit 0
          fi
          set -e
          test "$code" = "200"
          grep -q "AIL LABS Workspace" /tmp/index.html
          asset="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/index.html | head -n1 | cut -d'"' -f2)"
          test -n "$asset"
          code="$(fetch "$site$asset" /tmp/app.js)"
          test "$code" = "200"
          grep -q "Kalkulator Landed Cost" /tmp/app.js
