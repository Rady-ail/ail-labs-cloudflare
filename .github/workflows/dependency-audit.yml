name: Dependency Security Audit

on:
  push:
    branches:
      - audit/npm-dependency-review-2026-11-08

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Report npm audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const vulnerabilities = Object.values(report.vulnerabilities || {}).map(v => ({
              name: v.name,
              severity: v.severity,
              range: v.range,
              direct: v.isDirect,
              fixAvailable: v.fixAvailable,
              via: (v.via || []).map(item => typeof item === "string" ? item : item.title)
            }));
            console.log(JSON.stringify({
              counts: report.metadata?.vulnerabilities || {},
              vulnerabilities
            }, null, 2));
          '
