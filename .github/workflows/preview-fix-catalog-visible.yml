name: Preview fix-catalog-visible

on:
  push:
    branches:
      - fix-catalog-visible
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: preview-fix-catalog-visible
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build preview config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.name = 'ail-labs-katalog-preview';
          delete config.routes;
          fs.writeFileSync('wrangler.preview.json', JSON.stringify(config, null, 2) + '\\n');
          NODE

      - name: Deploy preview Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          node -e '
            const required = ["CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","DATABASE_URL","SESSION_SECRET"];
            for (const key of required) if (!process.env[key]) { console.error(key + " is missing"); process.exit(1); }
          '
          printf '{"DATABASE_URL":%s,"SESSION_SECRET":%s}' \
            "$(node -p 'JSON.stringify(process.env.DATABASE_URL)')" \
            "$(node -p 'JSON.stringify(process.env.SESSION_SECRET)')" \
            | npx wrangler@4.86.0 secret bulk --config wrangler.preview.json
          set +e
          output=$(npx wrangler@4.86.0 deploy --config wrangler.preview.json --name ail-labs-katalog-preview 2>&1)
          deploy_status=$?
          set -e
          printf '%s\n' "$output"
          if [[ $deploy_status -ne 0 ]]; then
            { echo '## Preview deploy — FAILED'; echo; echo '```text'; printf '%s\n' "$output"; echo '```'; echo; echo "**Failure summary:** Wrangler preview deployment exited with code $deploy_status."; } >> "$GITHUB_STEP_SUMMARY"
            exit "$deploy_status"
          fi
          preview_url=$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' | tail -1 || true)
          if [[ -z "$preview_url" ]]; then
            { echo '## Preview deploy — FAILED'; echo; echo 'Preview URL was not found in Wrangler output.'; echo; echo '```text'; printf '%s\n' "$output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          { echo '## Preview Worker'; echo; echo "**URL:** $preview_url"; echo; echo 'Secrets forwarded: `DATABASE_URL`, `SESSION_SECRET`.'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify preview HTTP
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        shell: bash
        run: |
          set -euo pipefail
          root_code=$(curl -L -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL/")
          health_code=$(curl -L -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL/api/health")
          products_code=$(curl -L -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL/api/products")
          echo "Preview URL: $PREVIEW_URL"
          echo "curl $PREVIEW_URL/ -> HTTP $root_code"
          echo "curl $PREVIEW_URL/api/health -> HTTP $health_code"
          echo "curl $PREVIEW_URL/api/products -> HTTP $products_code"
          { echo; echo '### HTTP verification'; echo; echo '| URL | HTTP |'; echo '|---|---:|'; echo "| \`$PREVIEW_URL/\` | $root_code |"; echo "| \`$PREVIEW_URL/api/health\` | $health_code |"; echo "| \`$PREVIEW_URL/api/products\` | $products_code |"; } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$root_code" != "200" || "$health_code" != "200" || "$products_code" != "200" ]]; then
            { echo; echo '## Preview verification — FAILED'; echo; echo '**Failure summary:** One or more preview endpoints did not return HTTP 200.'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Preview verified: $PREVIEW_URL"
